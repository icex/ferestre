# Runtime capability registry
#
# A recipe says what a title needs from the runtime, never which runtime build
# it needs. These are the names it may use. Each one is a behaviour a title can
# observe: something it calls, or something that has to succeed before it will
# start. A runtime that provides all of a title's `requires` can run it,
# whichever Proton or Wine version it was built from.
#
# Adding a name here is a promise: the runtime must keep providing it, or drop
# it deliberately and update every recipe that asks for it. Do not add a name
# for a debugging aid (patches/wine/0005-datagram-tracing.patch adds a WINEDEBUG
# channel, not a capability) -- only for something a title depends on.
#
# `symptom-if-missing` is what you see when the runtime does not have it. It is
# the field that makes a failed launch diagnosable by someone who was not there
# when it was first found.
#
# `verify` is how a build proves it has the capability rather than claiming it:
# a file inside the installed runtime and a string that only appears there once
# the patch is in. Every marker below was chosen by finding it in a real build
# and confirming it is absent without the patch -- a marker that is present
# upstream too would turn the manifest back into a promise. All markers of a
# capability must match; `loader.memfd-main-image` needs two patches and so has
# two. `scripts/write-capabilities.sh` runs these against an installed runtime
# and writes the manifest the launcher reads.

schema = 1

[[capability]]
name = "loader.memfd-main-image"
summary = """
Wine loads the process's main image from an inherited file descriptor named in \
WINE_DLL_FILE_MAP, and the fd survives the exec into Proton."""
provided-by = [
    "patches/wine/0001-mapped-main-image-appstate-and-mediaconv-rank.patch",
    "patches/proton/0001-keep-inherited-fds-mediaconv-and-system-ffmpeg.patch",
]
symptom-if-missing = "the title exits immediately with rc=1 and nothing in the log; the executable on disk is encrypted, so there is nothing to load without this"
note = "Every GDK/MSIXVC title requires this. It is the reason a title cannot be started by any other launcher."
verify = [
    { file = "files/lib/wine/x86_64-unix/ntdll.so", contains = "WINE_DLL_FILE_MAP" },
    { file = "proton", contains = "close_fds=False" },
]

[[capability]]
name = "loader.image-name-for-mapped-image"
summary = """
NtQueryInformationProcess reports the real path of a main image that was mapped \
from a memfd, so a title that asks where its own executable is gets an answer."""
provided-by = ["patches/wine/0006-process-image-name-for-a-memfd-mapped-main-image.patch"]
symptom-if-missing = "GetModuleFileNameEx(GetCurrentProcess(), NULL, ...) returns an empty string; DOOM 64 then calls strlen on what it makes of that and dies before it draws a frame, with rc=3 and nothing in the log"
note = """
Nothing in a recipe can work around this and no title needs to ask for it: the \
answer is wrong for every title that asks, and right for every title once the \
patch is in. Kept as a capability so a runtime too old to have it is named as \
the reason rather than the title being blamed."""
verify = [
    { file = "files/lib/wine/x86_64-unix/ntdll.so", contains = "image mapped from a memfd has no server name" },
]

[[capability]]
name = "winrt.loggingchannel"
summary = """
Windows.Foundation.Diagnostics.LoggingChannel, LoggingChannelOptions and \
LoggingOptions are activatable, hosted in windows.system.profile.systemid.dll."""
provided-by = ["patches/wine/0008-loggingchannel-winrt-classes.patch"]
symptom-if-missing = "RoGetActivationFactory fails for the class and the title dereferences what it got back -- Age of Empires Definitive Edition faults reading 0xFFFFFFFFFFFFFFFF on the next instruction"
note = """
Interface ids and method order are the published ones, taken from Microsoft's \
own metadata (microsoft/windows-rs), not inferred. That distinction is \
load-bearing: the channel factory a title asks for is ILoggingChannelFactory2, \
whose *second* method is the one it calls, and a vtable one entry short sends \
it jumping to address zero.

All three classes go together. A title walks the set in order -- options, then \
channel, then the per-event LoggingOptions -- and stopping one short leaves it \
holding an uninitialised pointer it does not check, which is the 0xFFFF... \
fault above rather than a clean failure."""
winrt-classes = [
    { class = "Windows.Foundation.Diagnostics.LoggingChannel", dll = "windows.system.profile.systemid.dll" },
    { class = "Windows.Foundation.Diagnostics.LoggingChannelOptions", dll = "windows.system.profile.systemid.dll" },
    { class = "Windows.Foundation.Diagnostics.LoggingOptions", dll = "windows.system.profile.systemid.dll" },
]
verify = [
    { file = "files/lib/wine/x86_64-windows/windows.system.profile.systemid.dll", contains = "LoggingChannelOptions" },
    { file = "files/lib/wine/x86_64-windows/windows.system.profile.systemid.dll", contains = "RuntimeClass_Windows_Foundation_Diagnostics_LoggingOptions" },
]

[[capability]]
name = "loader.exception-bytes"
summary = "An access violation logs the faulting instruction's bytes, not just its address."
provided-by = ["patches/wine/0007-dump-faulting-bytes-for-access-violations.patch"]
symptom-if-missing = "a crash in a title gives an address and nothing else; the image is decrypted into a memfd, so there is nothing on disk to disassemble afterwards"
note = "Diagnostic only, and it paid for itself twice: the bytes said `cmp byte ptr [rdi+rax], 0` in a loop, which is a strlen on a pointer somebody handed the title."
verify = [
    { file = "files/lib/wine/x86_64-windows/ntdll.dll", contains = "Code %p-32..+16" },
]

[[capability]]
name = "xgameruntime.analytics-info"
summary = "XSystemGetAnalyticsInfo fills the caller's buffer and returns it, on every path including the failing ones."
provided-by = ["patches/xgameruntime/0002-analytics-info-must-return-the-callers-buffer.patch"]
symptom-if-missing = "the title faults one instruction after the call, on `movups xmm0,[rax]` -- Goat Simulator 3 does exactly that and exits 3"
note = """
The API returns a struct by value, which in this ABI means the caller passes the \
buffer and expects the same pointer back. Returning NULL on a failure path is \
therefore a null dereference in the *title*, one instruction later, with nothing \
in the log to say why. There is no failure path where NULL is a legal answer."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "Desktop" },
]

[[capability]]
name = "xgameruntime.task-queue-lifetime"
summary = "A task queue terminates when told to, and an async result never reports success without writing what it promised."
provided-by = ["patches/xgameruntime/0003-task-queue-termination-and-async-results.patch"]
symptom-if-missing = "callbacks run after the title was told none would, against objects it has already freed; and a second XAsyncGetResult returns S_OK with the caller's buffer untouched"
note = """
Three defects an adversarial audit of this runtime confirmed. The queue runner \
was launched through CreateThread with a thread-pool callback's two-argument \
signature, so the queue pointer it used was whatever the ABI left in the second \
register. XTaskQueueTerminate drained an unrelated process-wide list and fired \
the terminated callback immediately, leaving the queue's own callbacks to run \
afterwards with `canceled` FALSE -- that callback is exactly the signal a title \
acts on to free the objects those callbacks touch."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "completed with no payload" },
]

[[capability]]
name = "xgameruntime.async-block-ownership"
summary = "XAsyncComplete refuses a block this runtime never began, instead of writing a result into whatever the pointer happens to be."
provided-by = ["patches/xgameruntime/0006-refuse-to-complete-an-async-block-we-never-began.patch"]
symptom-if-missing = "a fault inside xgameruntime.dll on the first dereference of the async block -- Age of Empires: Definitive Edition dies on the way into a match"
note = """
libHttpClient nests two async operations per HTTP call, and its error path \
completes a third block that it never initialised: observed arriving as NULL, \
as 0xfffffffffffffffe, and as 0x0000090b32e048a4, the last with result \
0x80190190 -- HTTP 400 as an HRESULT. Completing a block means writing the \
result into it, so an uninitialised pointer faults on the first store, inside \
this dll, which reads as a runtime bug rather than as a caller passing \
something that was never an XAsyncBlock.

The operation list is the arbiter: XAsyncComplete means nothing for a block \
XAsyncBegin did not start, so a block with no operation behind it is refused \
and named in the log rather than dereferenced."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "a block this runtime never began" },
]

