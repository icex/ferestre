# Forza Horizon 5 (Microsoft Store)
#
# Drives with the player's restored Windows profile, vehicle and livery.
# The player confirmed gameplay and subsequently confirmed the online fix.
# The service trace records successful title-service requests and the live
# Festival Playlist loads. A subsequent launch retained the selected vehicle.
# Restoration was local from a read-only Windows backup, not an automatic
# import feature. Multiplayer race completion has not been automated.
#
# Runtime fixes needed along the way:
#   * wine/0010 reports the filename of the memfd-mapped image, allowing the
#     title's own handler to restore its elided call sites.
#   * wine/0011 waits for concurrent_vector segments that another thread is
#     still allocating rather than returning its in-progress marker.
#   * wine/0013 normalises the GlobalRoot prefix before matching reads of the
#     executable to its decrypted image. The title's integrity check then reads
#     the same bytes that are running, instead of terminating with 0x1100.
#   * xgameruntime/0007, 0008 and 0009 supply the title id, package details and
#     successful empty speech-voice enumeration.
#   * xgameruntime/0010 preserves a provider's inline async result and defers
#     callback delivery while the provider's Begin runs. It also rejects a
#     missing result payload instead of copying from address zero.
#   * xgameruntime/0014 returns S_OK once XAsyncBegin setup succeeds. Returning
#     the provider's E_PENDING made libHttpClient tear down its context while
#     its accepted completion was queued, causing the 0xFFFFFFFFFFFFFFFF read
#     at ForzaHorizon5.exe+0x5D5B31E. 0015 cleans up a failed Begin after its
#     callback without requiring GetResult, including reused async blocks.
#   * xgameruntime/0016 gives XPackage a session identifier that fits its
#     33-byte buffer. Returning a 35-character package family name left Forza
#     polling installation status indefinitely.
#   * xgameruntime/0011 maps a zero save configuration id to the title's own
#     SCID. Imported WGS folders must retain their matching SCID suffix.
#   * xodus-cli/0013 accepts MicrosoftGame.Config's filename casing;
#     xgameruntime/0013 reports usable TLS protocol flags.
#   * xodus-cli/0014 authenticates legacy Windows titles by their own TitleId,
#     discovers their published endpoints, and caches tokens with the issuer
#     key and account/title/audience scope. No Forza host or ID is hardcoded.
#     xgameruntime/0017 corrects the missing-MSAAppId diagnostic.
#
# The earlier missing-title-claim theory did not explain the websocket crash:
# changing XAsyncBegin's return contract removed it without adding an MSAAppId.
# Code protection likewise needed correct runtime answers, not removal.
#
# After the package-identifier fix, a run made 936 ready-chunk queries, created
# three installation monitors and read the original 967,332-byte Windows
# profile. The world then rendered with the restored vehicle, HUD and minimap;
# the player confirmed gameplay works. Runtime regression tests pass all 107
# checks. Online title-service requests changed from HTTP 403 to HTTP 200.
# See docs/XBOX_LIVE.md for the shared implementation and validation limits.

schema = 1

[title]
product-id       = "9NNX1VVR3KNQ"
name             = "Forza Horizon 5"
slug             = "fh5"
publisher        = "Microsoft Studios"
package-identity = "Microsoft.624F8B84B80"
title-id         = "7900C3C7"
install-size-gb  = 149.0

[install]
dir-env    = "FH5_DIR"
prefix-env = "FH5_PREFIX"

[launch]
executable = 'ForzaHorizon5.exe'

[runtime]
requires = [
    "loader.memfd-main-image",
    "loader.mapped-image-through-file-api",
    "loader.section-name-for-mapped-image",
    "concrt140.concurrent-vector-push-back",
    "xgameruntime.title-id",
    "xgameruntime.package-details",
    "xgameruntime.speech-voice-enumeration",
    "xgameruntime.async-provider-completed-in-begin",
    "xgameruntime.async-begin-contract",
    "xgameruntime.package-identifier",
    "xgameruntime.save-provider-default-scid",
    "xnetworking.tls-protocol-flags",
]

[status]
state         = "playable"
summary       = "Plays with a restored Windows career; title services and the live Festival Playlist load after generic authentication and endpoint-discovery fixes. Player confirmed the online fix."
last-verified = 2026-09-07
verified-with = "tools/drive-fh5.py: restored Windows profile, rendered world and selected vehicle retained on the next launch. Title services returned HTTP 200 and the live Festival Playlist loaded; the player confirmed it worked. Source backup remained read-only. Multiplayer race completion not automated."

[[issues]]
symptom   = "the game exits seconds after launch with no window; the log ends in an unhandled illegal instruction inside ForzaHorizon5.exe"
cause     = "the title asks which file its own image was mapped from and is told nothing, because the image is mapped from a memfd that has no name in the NT namespace; its own handler then declines to restore the first elided call site"
fix       = "fixed by patches/wine/0010"
log-match = "Unhandled illegal instruction at address .* \\(thread"

[[issues]]
symptom   = "the game exits during startup and leaves Upload_CrashReport.xml naming ACCESS_VIOLATION_WRITE at 0x0000000000000009"
cause     = "concrt140's _Internal_push_back returned SEGMENT_ALLOC_MARKER (1) instead of a pointer, because _Internal_capacity counts a segment another thread is still allocating as capacity"
fix       = "fixed by patches/wine/0011"
log-match = "ACCESS_VIOLATION_WRITE"

[[issues]]
symptom   = "the splash screen appears, the window closes again, and the process exits 1 with no crash report and no fatal signal"
cause   = "the title opens its own executable as \\??\\GlobalRoot\\??\\Z:\\... to verify it, that spelling did not match the image map, and it hashed the encrypted bytes on disk. It then called TerminateProcess on itself with 0x1100"
fix       = "fixed by patches/wine/0013: strip the GlobalRoot prefix before matching, as the file layer does"
log-match = "process terminating itself abnormally"

[[issues]]
symptom   = "the game reaches its welcome screen and then faults reading address 0 inside ucrtbase's memmove"
cause     = "libHttpClient asked for a 16-byte websocket result; the block recorded that size but the operation holding the bytes had been withdrawn, so XAsyncGetResult copied from a null payload"
fix       = "fixed by patches/xgameruntime/0010"
log-match = "completed with no payload for a .* byte buffer"

[[issues]]
symptom   = "the game faults reading 0xFFFFFFFFFFFFFFFF just after its Real-Time Activity websocket connects"
cause     = "after the inline-result fix, XAsyncBegin still returned the provider's E_PENDING to libHttpClient, which treated it as a failed start and destroyed the context needed by the queued completion"
fix       = "fixed by patches/xgameruntime/0014 and 0015: setup returns S_OK, provider failures complete asynchronously and failed-Begin cleanup waits for its callback"
log-match = "0xFFFFFFFFFFFFFFFF"

[[issues]]
symptom   = "the title's own profile is never found: it reads User_<xuid>/ProfileBackup and gets E_GS_BLOB_NOT_FOUND even where a save copied from Windows exists"
cause     = "the title initialises its save provider with an all-zero configuration id, which means the title's own SCID; taking it literally named the save folder after a zero SCID"
fix       = "fixed by patches/xgameruntime/0011"
log-match = "title named no service configuration; using its own"

[[issues]]
symptom   = "INSTALLING... PLEASE WAIT persists while the game repeatedly queries its current package identifier"
cause     = "XPackageGetCurrentProcessPackageIdentifier returned a 35-character package family name into the GDK's 33-byte buffer and failed every query"
fix       = "fixed by patches/xgameruntime/0016: current-package queries and enumeration share a bounded opaque session identifier"

[[issues]]
symptom   = "Forza Online reports: Forza Horizon 5 server is currently not available"
cause     = "the client required MSAAppId for every title claim and only read default Xbox service endpoints; this legacy Windows title omits MSAAppId and publishes its own token audience"
fix       = "fixed by patches/xodus-cli/0014: Windows TitleId authentication, per-title endpoint discovery and issuer-bound token caching; all selected from metadata"
