# Goat Simulator 3: Windows Edition -- Microsoft Store / Game Pass
#
# An Unreal WinGDK title, the same shape as Expedition 33. It used to fault one
# instruction after calling XSystemGetAnalyticsInfo, and the reason is worth
# knowing: that API returns a struct *by value*, so the caller passes a buffer
# and expects the same pointer back. Every failure path in the runtime returned
# NULL instead, and this title does
#
#     call rax             ; XSystemGetAnalyticsInfo
#     movups xmm0,[rax]    ; copy the 32 bytes it returned
#
# so NULL was a fault in the title's own code with nothing to explain it. Fixed
# in the runtime, not here.

schema = 1

[title]
product-id      = "9PDS2N82QNXG"
name            = "Goat Simulator 3: Windows Edition"
slug            = "goat-simulator-3"
publisher       = "Coffee Stain Publishing"
install-size-gb = 26.0


[launch]
executable = 'Goat2\Binaries\WinGDK\Goat2-WinGDK-Shipping.exe'

[runtime]
requires = [
    "loader.memfd-main-image",
    "xgameruntime.analytics-info",
    "xgameruntime.analytics-device-family",
    "xgameruntime.store-product-lifetime",
]

[status]
state = "menus"
stops-at = "San Angora world loading; menus and online sign-in succeeded"
summary = "Menus and online sign-in work with the updated runtime; San Angora world loading remains stuck. Gameplay and co-op are not qualified on this build."
last-verified = 2026-10-10
verified-with = "Game Pass package, isolated prefix; Xbox/PlayFab sign-in and session requests succeeded, native Party initialization passed; world loading did not complete"

[[issues]]
symptom = "Starting San Angora remains on the loading screen"
cause = "Not established. The loading run repeatedly requested an unsupported save interface, IID ab4ae4fb-6508-4950-a032-45fd4bf8c43b."
fix = "Investigation paused. Verify the native save interface ABI before implementing it; successful sign-in does not qualify world loading."
log-match = "ab4ae4fb-6508-4950-a032-45fd4bf8c43b"

[[issues]]
symptom = "Online sign-in reports unknown network error GS3-NF-2"
cause = "The runtime truncated Windows.Desktop to Windows, which the shipped PlayFab Party library did not recognize."
fix = "Update the runtime to one providing analytics-device-family. Peer joining and voice remain untested."
log-match = "GS3-NF-2"

[[issues]]
symptom = "The game crashes while processing owned Store products"
cause = "Product callbacks received stack data that expired before the game finished using it."
fix = "Update the runtime to one providing store-product-lifetime; product data now remains valid until its query handle closes."
