# DRAFT — not buildable yet. The launcher it packages does not exist.
#
# The id matches the AppImage build and the project's GitHub home, which is what
# Flathub wants: an id under a domain the submitter controls.
id: io.github.icex.ferestre

runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ferestre

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # The client stores account tokens in the keyring and currently cannot start
  # without a Secret Service provider.
  - --talk-name=org.freedesktop.secrets
  # Installs are tens of gigabytes; the user picks where they live.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

modules:
  - name: ferestre
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
    build-commands:
      - cargo build --release --offline
      - install -Dm755 target/release/ferestre /app/bin/ferestre
    sources:
      - type: dir
        path: ../..

  # The patched Proton runtime is NOT bundled: ~264 MiB, versioned separately,
  # downloaded on first use. If Flathub requires it declared up front it becomes
  # an extra-data source here rather than a silent download.
