[[capability]]
name = "loader.mapped-image-through-file-api"
summary = """
An image named in WINE_DLL_FILE_MAP is served from its descriptor when it is \
opened read-only through the ordinary file API, not only when the loader maps \
it, and each handle gets a file offset of its own."""
provided-by = [
    "patches/wine/0009-serve-a-mapped-image-through-the-file-api.patch",
    "patches/wine/0013-match-the-globalroot-form-of-a-mapped-image-s-name.patch",
]
symptom-if-missing = "a launcher or an integrity check that reads the game's own image gets the still-encrypted bytes. Halo Infinite's EasyAntiCheat bootstrapper stops with 201, 'Invalid game executable path!', naming a file that is plainly there; Forza Horizon 5 hashes what it reads and kills its own process"
note = """
Windows has no split between the two: the Store's filter driver decrypts on \
read, so anything that opens a package's executable sees a PE. Here the \
plaintext exists only behind a descriptor, and a title that inspects its own \
payload rather than executing it saw ciphertext. The private file offset \
matters as much as the substitution -- EasyAntiCheat reads all 83 MB of the \
game binary, which on a shared descriptor would leave the loader's next read \
at end of file.

The name has to be matched in both spellings. \\??\\GlobalRoot\\??\\Z:\\... names \
the same file as \\??\\Z:\\..., and a title reaching the object namespace \
directly uses the long form: Forza Horizon 5 verifies its own executable that \
way, and while only the short form matched it hashed the encrypted bytes and \
stopped the process."""
verify = [
    { file = "files/lib/wine/x86_64-unix/ntdll.so", contains = "served from the mapped image descriptor" },
]

[[capability]]
name = "loader.section-name-for-mapped-image"
summary = """
NtQueryVirtualMemory(MemoryMappedFilenameInformation) reports the real path of \
a main image mapped from a memfd, so a title that asks which file its own code \
came from gets an answer instead of an empty string."""
provided-by = ["patches/wine/0010-answer-the-mapped-image-s-own-filename.patch"]
symptom-if-missing = "Forza Horizon 5 asks three times on its image base, is told its code came from nowhere, and its own code-restoring handler then declines the first elided call site: an unhandled illegal instruction at ForzaHorizon5.exe+0x53d5cec, seconds after launch, with no window"
note = """
The server answers this from the name of the file a view was mapped from, and \
a view mapped through WINE_DLL_FILE_MAP was mapped from a descriptor with no \
name in the NT namespace -- so the query succeeded and returned "". Windows has \
no such split; the Store's filter driver decrypts on read and the answer is \
simply the path. Sibling of loader.image-name-for-mapped-image: same cause, \
different question, and this one is what a title asks about its own code rather \
than about its process."""
verify = [
    { file = "files/lib/wine/x86_64-unix/ntdll.so", contains = "is the main image and has no section name" },
]

[[capability]]
name = "concrt140.concurrent-vector-push-back"
summary = """
_Concurrent_vector_base_v4::_Internal_capacity does not count a segment that \
is still being allocated, so _Internal_reserve settles it and no caller \
derives an element address from the in-progress marker."""
provided-by = ["patches/wine/0011-concrt140-do-not-derive-a-pointer-from-the-in-progres.patch"]
symptom-if-missing = "an access violation writing to 0x9 during startup, from a `mov [rax+8], reg` two instructions after the _Internal_push_back call; Forza Horizon 5 records it in its own Upload_CrashReport.xml as ACCESS_VIOLATION_WRITE with EXCEPTION_INFO 0x0000000000000009"
note = """
A Wine bug rather than anything specific to this project, and worth sending \
upstream. _Internal_reserve asks _Internal_capacity whether a segment is \
present and that treated SEGMENT_ALLOC_MARKER as present, so it returned \
without allocating and callers derived an element address from the marker: \
_Internal_push_back hands 1 to the application, which writes through it \
(1 + 8 = 9), and _Internal_grow_by, _Internal_copy and _Internal_assign copy \
into it. Fixing capacity fixes all of them; push_back keeps a last-line check \
because the address it returns is written through immediately. Any \
multithreaded user of concurrent_vector can reach this."""
verify = [
    { file = "files/lib/wine/x86_64-windows/concrt140.dll", contains = "settling it before returning an element" },
]

[[capability]]
name = "xgameruntime.title-id"
summary = """
XGameGetXboxTitleId reports the TitleId from MicrosoftGame.config rather than \
zero, so a title that asks for its own identity gets it."""
provided-by = ["patches/xgameruntime/0007-report-the-package-s-own-xbox-title-id.patch"]
symptom-if-missing = "Forza Horizon 5 gets through startup and then spends 939 iterations polling XPackageGetCurrentProcessPackageIdentifier before giving up; with the real id it makes 7,735 GDK calls instead of 217"
note = """
The config carries it and xgr_title_identity() already reads it for the token \
endpoints, so this was a blank where an answer was available. Zero is still the \
answer when there is no config to read, because callers treat a failure here as \
fatal and an error would be worse than a blank."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "reporting title id" },
]

[[capability]]
name = "xgameruntime.package-details"
summary = """
XPackageEnumeratePackages reports the package's real display name, description, \
publisher and store id from MicrosoftGame.config, instead of the package family \
name and three empty strings."""
provided-by = ["patches/xgameruntime/0008-report-the-package-s-real-details.patch"]
symptom-if-missing = "a title looking for itself in the list it just asked for does not recognise the entry, and anything keyed on storeId finds nothing"
note = """
Measured on Forza Horizon 5, and it is not a straightforward win: with storeId \
blank it polls XPackageGetCurrentProcessPackageIdentifier 939 times and exits, \
and with the real 9NNX1VVR3KNQ it stops earlier and more quietly, at 211 GDK \
calls instead of 7,747. Isolated to that one field by blanking it alone. \
Reporting it is still right -- Windows does, and a title following its store id \
into a path this runtime does not serve is a gap in XStore rather than a reason \
to hide the field. Recorded here so the next person knows what the field \
unlocks."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "reporting package %s (%s), store %s, title %s" },
]

[[capability]]
name = "loader.file-allocation-and-abnormal-exit"
summary = """
NtSetInformationFile implements FileAllocationInformation instead of stubbing \
it, and a process that terminates itself abnormally says so with its exit \
code."""
provided-by = ["patches/wine/0012-file-allocation-and-an-abnormal-self-termination-is-w.patch"]
symptom-if-missing = "setting a file's allocation size silently does nothing, and a title that hard-kills itself leaves no trace at all: the process vanishes and Proton reports 1, because a status whose low byte is zero is mapped to 1 on the way out"
note = """
Both came out of Forza Horizon 5's startup and neither fixes it. The allocation \
stub is a real gap -- it fired while the title was writing an alternate data \
stream on its own executable -- and shrinking below end of file is observable, \
so answering success while leaving the file its old length is a lie a caller \
can see. The warning is what turned "the process just disappeared" into "it \
terminated itself with 0x1100", which took strace to learn the first time."""
verify = [
    { file = "files/lib/wine/x86_64-unix/ntdll.so", contains = "process terminating itself abnormally" },
]

[[capability]]
name = "xgameruntime.speech-voice-enumeration"
summary = """
XSpeechSynthesizerEnumerateInstalledVoices reports that there are no voices, \
rather than failing with E_NOTIMPL."""
provided-by = ["patches/xgameruntime/0009-enumerating-no-voices-is-a-success.patch"]
symptom-if-missing = "a title that asks what speech voices exist during startup is told the question is invalid, which is not an answer it can carry on from"
note = """
There is no speech synthesiser here, so there are no voices -- and reporting \
none is a success. Windows returns S_OK and calls the callback once per voice; \
a machine with none simply gets no calls. Forza Horizon 5 asks."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "XSpeechSynthesizerCreate" },
]
