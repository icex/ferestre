# Repository-wide guards that must see every change, so this workflow has no
# path filter: a README- or docs-only push or pull request runs it too, and
# that is exactly where a forbidden URL would most likely be pasted.
#
# `no-nvidia-urls`: no committed file may hold a URL of an NVIDIA file (the
# nvngx_dlssnr.dll download comes only from the person's own settings or
# environment). The check only reads the checkout; it builds and runs nothing
# else, so it runs on a GitHub-hosted runner, for pull requests from forks too.
name: Guards

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request, or to a branch other than main and dev,
# cancels the older run. Main, dev, tags and manual runs each get a group of
# their own (the run id) and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev')) && format('{0}-{1}', github.event_name, github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev') }}

jobs:
  no-nvidia-urls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: No URL of an NVIDIA file
        run: python3 tests/test_no_nvidia_urls.py
