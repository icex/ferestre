# The launcher's own tests. Separate jobs, because they need different things.
#
# `test` is the fast one: everything decided in `ferestre-core` and in the GUI's
# `model` is pure, so it runs anywhere with a Rust toolchain -- no display, no
# runtime, no Microsoft account, no game.
#
# `msrv` builds and tests the same workspace with the oldest compiler it claims
# to support, the `rust-version` in Cargo.toml, so that claim cannot quietly go
# stale when Cargo.lock moves a dependency onto a newer one.
#
# `gui` drives the real window through AT-SPI, which needs a display server and
# the accessibility bus. It is the only thing that can catch a row that renders
# with the wrong label or a button wired to nothing, and it is worth the extra
# minute of setup.
#
# Every job here runs with a read-only token that is not written to the
# checkout, and every third-party action is pinned to a commit, because a tag
# or a branch can be moved to code nobody reviewed. Every cargo call is
# --locked: CI tests the dependency versions in Cargo.lock, which are the ones
# a release ships.
name: Rust

on:
  push:
    # dev as well as main. Work lands on dev and only reaches main to be
    # released, so a filter naming main alone would mean every ordinary
    # push ran no checks at all -- and the checks would come back exactly
    # when the work was already finished.
    branches: [main, dev]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/gui_smoke.py'
      - 'tests/gui_accounts.py'
      - 'tests/gui_presence.py'
      - 'tests/gui_client_deps.py'
      - 'tests/gui_updater.py'
      - 'tests/gui_transfers.py'
      - 'tests/gui_artwork.py'
      - 'tests/gui_controller.py'
      - 'tests/gui_launch.py'
      - 'tests/gui_running.py'
      - 'tests/gui_controller_install.py'
      - 'tests/gui_accounts_controller.py'
      - 'tests/gui_runtime_selection.py'
      - 'tests/gui_update_resume.py'
      - 'tests/gui_update_existing.py'
      - 'tests/gui_library_error.py'
      - 'tests/gui_controller_focus.py'
      - 'tests/controller_driver.py'
      - 'tests/test_gui_actions.py'
      - 'tests/run_wayland_gui.py'
      - 'tests/wayland_focus.py'
      - 'tests/test_source_pins.py'
      - 'tests/test_runtime_staging.py'
      - 'tests/test_transfer_controls.py'
      - 'tests/fake_packagekit.py'
      - 'tests/test_download_cancel.py'
      - 'tests/test_media_dependencies.py'
      - 'tests/test_client_dependencies.py'
      - 'tools/**'
      - 'tests/endpoint_suite.py'
      - 'titles/**'
      # The source job checks source pins and their packaging consumers.
      - 'sources.lock.json'
      - '.gitmodules'
      # All of scripts/, not a list: the shim sources xodus-env.sh on every
      # launch, launch-core tests read launch-gdk.sh, and the shell syntax step
      # covers the rest. A list left out exactly the files a change to one
      # would break.
      - 'scripts/**'
      - 'packaging/**'
      - 'tests/test_real_path_image_view.py'
      - 'tests/test_caller_ids_image_view.py'
      - 'tests/test_proton_wine_shim.py'
      - 'tests/test_fix_xcurl.py'
      - 'tests/test_launch_gdk.py'
      - 'tests/test_install_xodus_proton.py'
      - 'tests/test_build_appimage.py'
      - 'tests/test_release_signing.py'
      - 'tests/test_workflows.py'
      # The native harnesses and fixtures: the shell syntax step and the
      # `sources` job check these.
      - 'tests/*.sh'
      - 'tests/license_token_fixture.py'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/gui_smoke.py'
      - 'tests/gui_accounts.py'
      - 'tests/gui_presence.py'
      - 'tests/gui_client_deps.py'
      - 'tests/gui_updater.py'
      - 'tests/gui_transfers.py'
      - 'tests/gui_artwork.py'
      - 'tests/gui_controller.py'
      - 'tests/gui_launch.py'
      - 'tests/gui_running.py'
      - 'tests/gui_controller_install.py'
      - 'tests/gui_accounts_controller.py'
      - 'tests/gui_runtime_selection.py'
      - 'tests/gui_update_resume.py'
      - 'tests/gui_update_existing.py'
      - 'tests/gui_library_error.py'
      - 'tests/gui_controller_focus.py'
      - 'tests/controller_driver.py'
      - 'tests/test_gui_actions.py'
      - 'tests/run_wayland_gui.py'
      - 'tests/wayland_focus.py'
      - 'tests/test_source_pins.py'
      - 'tests/test_runtime_staging.py'
      - 'tests/test_transfer_controls.py'
      - 'tests/fake_packagekit.py'
      - 'tests/test_download_cancel.py'
      - 'tests/test_media_dependencies.py'
      - 'tests/test_client_dependencies.py'
      - 'tools/**'
      - 'tests/endpoint_suite.py'
      - 'titles/**'
      # The source job checks source pins and their packaging consumers.
      - 'sources.lock.json'
      - '.gitmodules'
      # All of scripts/, not a list: the shim sources xodus-env.sh on every
      # launch, launch-core tests read launch-gdk.sh, and the shell syntax step
      # covers the rest. A list left out exactly the files a change to one
      # would break.
      - 'scripts/**'
      - 'packaging/**'
      - 'tests/test_real_path_image_view.py'
      - 'tests/test_caller_ids_image_view.py'
      - 'tests/test_proton_wine_shim.py'
      - 'tests/test_fix_xcurl.py'
      - 'tests/test_launch_gdk.py'
      - 'tests/test_install_xodus_proton.py'
      - 'tests/test_build_appimage.py'
      - 'tests/test_release_signing.py'
      - 'tests/test_workflows.py'
      # The native harnesses and fixtures: the shell syntax step and the
      # `sources` job check these.
      - 'tests/*.sh'
      - 'tests/license_token_fixture.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The GUI crate links GTK4 and libadwaita, so the workspace needs them
      # even to type-check.
      # minisign for the release signing tests, shellcheck for the shell
      # syntax step, PyYAML for the workflow checks.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev minisign shellcheck python3-yaml

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Restored everywhere, saved only from main: a cache saved for a pull
      # request or another branch is visible to that ref alone, and every
      # copy counts against the repository's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Ubuntu's runners restrict unprivileged user namespaces through
      # AppArmor, and the image-view tests skip themselves where the namespace
      # probe fails -- which would leave the code that keeps decrypted game
      # files private, and the graceful Stop of a title inside the image
      # view's namespaces (stop.rs), untested behind a green tick. Lift the
      # restriction for this runner before any test runs, and tell the tests
      # a skip is a failure here.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount true

      - name: Test
        env:
          FERESTRE_REQUIRE_USERNS: '1'
        run: cargo test --locked --workspace

      - name: Download cancellation (offline)
        run: cargo build --locked -p ferestre-cli && python3 tests/test_download_cancel.py && python3 tests/test_transfer_controls.py && python3 tests/test_media_dependencies.py && python3 tests/test_client_dependencies.py

      - name: Launch helper tests
        env:
          FERESTRE_REQUIRE_USERNS: '1'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*image_view.py'
          python3 tests/test_proton_wine_shim.py
          python3 tests/test_fix_xcurl.py
          python3 tests/test_launch_gdk.py
          python3 tests/test_install_xodus_proton.py

      # Syntax for every shell script, under the shell its #! names: the shim
      # and xodus-env.sh run under /bin/sh, which is dash here, so a bashism
      # in them is caught by sh -n and would otherwise only show at launch.
      # shellcheck at error severity on top, which finds what -n cannot (an
      # unquoted array, a test that is always true) without failing on style.
      - name: Shell syntax
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
              case "$(head -n1 "$f")" in
                  *bash*) shell='bash' ;;
                  '#!/bin/sh'*|'#!/usr/bin/env sh'*) shell='sh' ;;
                  *) case "$f" in *.sh) shell='sh' ;; *) continue ;; esac ;;
              esac
              "$shell" -n "$f" || status=1
              shellcheck --severity=error --shell="$shell" "$f" || status=1
          done < <(find scripts packaging tests -type f \( -name '*.sh' -o -name AppRun \) -print0)
          exit "$status"

      - name: Packaging and release tests
        env:
          FERESTRE_REQUIRE_MINISIGN: '1'
        run: |
          python3 tests/test_workflows.py
          python3 tests/test_source_pins.py
          python3 tests/test_runtime_staging.py
          python3 tests/test_release_signing.py
          python3 tests/test_build_appimage.py

      - name: Developer tool tests (offline)
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  # The oldest compiler the workspace says it builds with. 1.88 is not a
  # preference: it is what the dependency versions in Cargo.lock require
  # (zopfli, under zip's deflate feature, is the newest at 1.88). Raise this
  # together with `rust-version` in Cargo.toml, in the commit that moves the
  # lock; tests/test_workflows.py checks the two agree.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: '1.88'

      # Restored everywhere, saved only from main: a cache saved for a pull
      # request or another branch is visible to that ref alone, and every
      # copy counts against the repository's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # As in `test`: the namespace tests must run, not skip.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount true

      # Named explicitly, so a runner image with a different default compiler
      # cannot make this job test something else.
      - name: Test with the minimum supported Rust
        env:
          FERESTRE_REQUIRE_USERNS: '1'
        run: |
          rustc +1.88 --version
          cargo +1.88 test --locked --workspace

  # Verify all five immutable fork commits and their nested gitlinks without
  # checking out the complete Wine tree, then run the client’s offline tests.
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out the pinned client fork
        run: git submodule update --init --quiet third_party/xodus-cli

      - name: Verify public fork commits and nested pins
        run: scripts/check-sources.sh --remote

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      # WebKitGTK, GTK 3 and libsoup because xodus-cli links wry for the
      # sign-in window, and its tests link the binary's crate.
      - name: Client test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev protobuf-compiler \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev

      # The client is a workspace of its own, with its own target directory.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: third_party/xodus-cli -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fixture script syntax
        run: |
          bash -n tests/run-tests.sh tests/build-license-service-fixture.sh
          python3 -m py_compile tests/license_token_fixture.py tests/related_license_fixture.py

      # Offline, loopback only: the service, the download integrity checks
      # (msixvc's hash tree, header signatures with throwaway test keys, and
      # retries; the CLI's path and commit rules, and the package key's
      # sourcing against recorded-shape fixtures -- its live tests are
      # ignored),
      # the presence runner (a local server and a fake token provider; it
      # never signs in), the profile store and the file-backed key chain.
      - name: Test the pinned client fork offline
        run: |
          set -euo pipefail
          python3 scripts/source-pins.py verify xodus --directory third_party/xodus-cli
          cd third_party/xodus-cli
          cargo test --locked -p xodus-service
          cargo test --locked -p xodus profile
          cargo test --locked -p xodus api::xbox::auth
          cargo test --locked -p xodus device_response_
          cargo test --locked -p msixvc
          cargo test --locked -p xodus-cli
          cargo test --locked -p xodus --features key-chain-file --test key_chain_file

  gui:
    runs-on: ubuntu-latest
    env:
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev \
            at-spi2-core gir1.2-atspi-2.0 python3-gi openbox \
            xvfb dbus-x11

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      # Restored everywhere, saved only from main: a cache saved for a pull
      # request or another branch is visible to that ref alone, and every
      # copy counts against the repository's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the window
        run: cargo build --locked -p ferestre-gui -p ferestre-cli

      - name: Accessibility action-export unit tests
        run: python3 tests/test_gui_actions.py

      # A session bus for the accessibility bus to live on, a display for the
      # window to map into, and then the test drives it by pressing things.
      # Keep virtual displays running across transient periods with no clients;
      # retain server diagnostics if a window cannot connect. Use the same X11
      # software renderer as the local headless checks.
      # Do not reuse a display while the preceding Xvfb is shutting down.
      - name: Smoke test
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=110 --server-args='-screen 0 1280x900x24 -noreset' \
            dbus-run-session -- python3 tests/gui_smoke.py

      - name: Move location and automatic space checks (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=111 --server-args='-screen 0 1280x900x24 -noreset' \
            dbus-run-session -- python3 tests/gui_move.py --binary target/debug/ferestre-gui

      - name: Separate Store and Player accounts (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=112 --server-args='-screen 0 1280x900x24 -noreset' \
            dbus-run-session -- python3 tests/gui_accounts.py

      # The client is a script that advertises presence-v1 and plays back
      # runner events, so this signs nothing in and posts nothing.
      - name: Online status while a game runs (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=113 --server-args='-screen 0 1280x900x24 -noreset' \
            dbus-run-session -- python3 tests/gui_presence.py

      # PackageKit is a fake on a private bus standing in for the system one,
      # and the missing library is a fixture, so this installs nothing.
      - name: Secure application and runtime updater (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=114 --server-args='-screen 0 1280x900x24 -noreset' \
            dbus-run-session -- python3 tests/gui_updater.py

      - name: Game Pass artwork and handheld fullscreen (loopback)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=115 --server-args='-screen 0 1280x720x24 -noreset' \
            dbus-run-session -- python3 tests/gui_artwork.py --fullscreen
      - name: Controller adapter, button glyphs and focus indicator (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=116 --server-args='-screen 0 1280x900x24 -noreset' \
            dbus-run-session -- python3 tests/gui_controller.py

      - name: Game launch loading, running state and background Home (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=117 --server-args='-screen 0 1280x720x24 -noreset' \
            dbus-run-session -- python3 tests/gui_launch.py

      - name: Controller Resume and confirmed Stop (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=120 --server-args='-screen 0 1280x720x24 -noreset' \
            dbus-run-session -- python3 tests/gui_running.py

      - name: Controller keyboard, install destination and queue (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=121 --server-args='-screen 0 1280x720x24 -noreset' \
            dbus-run-session -- python3 tests/gui_controller_install.py

      - name: Controller download controls at desktop height (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=126 --server-args='-screen 0 1280x900x24 -noreset' \
            dbus-run-session -- python3 tests/gui_controller_install.py

      - name: Controller account selection (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=122 --server-args='-screen 0 1280x720x24 -noreset' \
            dbus-run-session -- python3 tests/gui_accounts_controller.py

      - name: Controller global and per-game runtime selection (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=123 --server-args='-screen 0 1280x720x24 -noreset' \
            dbus-run-session -- python3 tests/gui_runtime_selection.py

      - name: Resume paused updates from the game grid (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=124 --server-args='-screen 0 1280x720x24 -noreset' \
            dbus-run-session -- python3 tests/gui_update_resume.py

      - name: Update installed games in place without an install prompt (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=127 --server-args='-screen 0 1280x720x24 -noreset' \
            dbus-run-session -- python3 tests/gui_update_existing.py

      - name: Library authentication errors and recovery (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=128 --server-args='-screen 0 1280x720x24 -noreset' \
            dbus-run-session -- python3 tests/gui_library_error.py

      - name: Controller tab focus and single selection outline (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=125 --server-args='-screen 0 1280x720x24 -noreset' \
            dbus-run-session -- python3 tests/gui_controller_focus.py

      - name: Persistent install queue and pause controls (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=118 --server-args='-screen 0 1280x900x24 -noreset' \
            dbus-run-session -- python3 tests/gui_transfers.py

      - name: Missing WebKitGTK offered for install (offline)
        run: |
          xvfb-run -a --error-file=/dev/stderr --server-num=119 --server-args='-screen 0 1280x900x24 -noreset' \
            dbus-run-session -- python3 tests/gui_client_deps.py
