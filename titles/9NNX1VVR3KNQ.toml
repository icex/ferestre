# Forza Horizon 5 (Microsoft Store)
#
# Downloads, decrypts, maps, and dies during static initialisation calling a
# function whose first five bytes are not an instruction. What follows is
# measured, because two earlier versions of this file guessed: first that the
# binary was protected, then -- after the guess was rightly challenged -- that
# the fault was ours. The measurements say protected, and they say it in a way
# that can be rechecked with tools/pe-holes.py rather than believed.
#
# THE MECHANISM
#
# Direct `call`/`jmp rel32` instructions have been removed from part of the
# image. Each is replaced by five bytes of filler. Walk a function from the
# entry .pdata declares, and wherever decoding breaks, skip five bytes and
# resume: the decode then reaches the declared end exactly, with nothing left
# over. In a 256 KiB sample, 283 of 300 functions are explained that way; 183
# of those have no holes at all, so roughly a third of functions are touched
# and the rest are shipped intact.
#
# The filler is chosen, not random. Across 548 holes, 56% begin with a one-byte
# opcode that has no encoding in 64-bit mode -- 0xea, 0x9a, 0x3f, 0xd4, 0xd6,
# 0x37, 0x27, 0x16 -- drawn about evenly from that set, against a 7.8% chance
# level. Executing an unrestored hole therefore raises #UD immediately instead
# of running somewhere arbitrary. That is a designed property.
#
# The control is what makes the number mean something. The same detector, run
# on BenchmarkDefinition.x64.Release.dll -- an ordinary unencrypted DLL beside
# the game -- reports 8.1% against the same 7.8% chance level, and its "holes"
# are the decoder walking into jump tables (127 of 173 begin with 0x00). The
# test discriminates; FH5 is seven times chance and the DLL is not.
#
# The faulting function is the pattern in miniature: 368 bytes, 79 instructions
# and 19 holes, every hole exactly five bytes, and the code around them is the
# setup and use of the calls that are missing --
#
#     mov rcx,rdi / mov edx,0x1000 / mov r8d,0x40 / lea r9,[rbp-0x28]
#     <hole>                          ; VirtualProtect(p,0x1000,PAGE_EXECUTE_READWRITE,&old)
#     sub rbx,rdi / sub rbx,5 / mov [rdi+1],ebx    ; write a rel32 at [rdi+1]
#
# -- a routine that makes a page writable and patches a five-byte instruction.
# Its own five-byte instructions are the ones missing.
#
# WHAT IS EXCLUDED, BY MEASUREMENT
#
#   * Not the container decrypt. The bytes Wine executes are byte-identical to
#     the bytes the client produces (48 bytes compared at the faulting address);
#     inter-function CC padding around the fault is pristine; and 548 of 548
#     holes land exactly on instruction boundaries where a call belongs. AES-XTS
#     garbles a whole 4096-byte unit or nothing -- it does not land on call
#     sites.
#   * Not a bad download. A second full install into a separate directory
#     produced the identical file: sha256 869adb5f8b2c245dba4baa653a22f6b19b1c83
#     dead1078f1..., 0 of 171,851,776 bytes different.
#   * Not our image mapping. Wine maps it at its preferred base 0x140000000 with
#     the right section protections, and disk and memory agree.
#   * Not an OS loader mechanism. The load config carries no dynamic value
#     relocation table and no hot-patch table (both fields zero), so nothing
#     documented rewrites call sites at load time. GuardFlags is 0x100 and the
#     CFG function table is empty.
#   * Not the title re-reading its own image. With +file tracing the game
#     process never opens ForzaHorizon5.exe; it normalises its own path and
#     nothing more. So the decrypted-only-in-a-memfd layout is not the problem.
#   * Not a missing Windows API. Before the fault the process reaches only ETW
#     stubs (EtwRegisterTraceGuidsW, EtwEventSetInformation) and makes no GDK
#     call at all.
#   * Not our TLS handling. Both TLS callbacks run and return (WINE_TRACE_TLS=1).
#
# WHAT IS LEFT
#
# The restorer is in the image and it runs: a vectored handler is registered at
# 0x53b85b8 (an intact `jmp` thunk, with high-entropy data immediately after it)
# and is called for the illegal instruction -- and returns 0, declining it. So
# the title's own protection is present and chooses not to restore the code
# here. Making it restore means working out what that decision depends on and
# satisfying it, which is defeating the protection rather than porting around
# it. That is not something this project will do, and owning the game does not
# change what the work is. The container decrypt is the licence working as
# intended; this is not.
#
# So this stays broken, on purpose, with the mechanism named. Anyone who wants
# to recheck the claim rather than take it:
#
#     tools/pe-holes.py <a decrypted copy of the image> --sample 300
#     tools/pe-holes.py <any ordinary DLL>              --sample 300

schema = 1

[title]
product-id       = "9NNX1VVR3KNQ"
name             = "Forza Horizon 5"
slug             = "fh5"
publisher        = "Microsoft Studios"
package-identity = "Microsoft.624F8B84B80"
title-id         = "7900C3C7"
install-size-gb  = 149.0

[install]
dir-env    = "FH5_DIR"
prefix-env = "FH5_PREFIX"

[launch]
executable = 'ForzaHorizon5.exe'

[runtime]
# Only the loader is claimed, because that is all this title has been observed
# to reach: the client decrypts the image and Wine maps it, then the title's
# own code stops the process. Whatever else it would need is unknown, and
# guessing would put untested names in the matrix.
requires = ["loader.memfd-main-image"]

[status]
state         = "broken"
blocked-by    = "title-protection"
summary       = "Direct call sites are elided from about a third of its functions and the title's own restorer declines to put them back, so it dies calling one during static initialisation."
stops-at      = "an illegal instruction (0xc000001d) at ForzaHorizon5.exe+0x53d5cec, reached through ucrtbase's _initterm, with no GDK call made first"
last-verified = 2026-09-07
verified-with = "ferestre run fh5 with WINEDEBUG=+seh,+file and WINE_TRACE_TLS=1; tools/pe-holes.py over the decrypted image and over BenchmarkDefinition.x64.Release.dll as a control"

[[issues]]
symptom   = "the game exits seconds after launch with no window; the log ends in an unhandled illegal instruction inside ForzaHorizon5.exe"
cause     = "a code-protection layer. Direct call/jmp rel32 instructions are replaced by five bytes of filler whose first byte is an opcode invalid in 64-bit mode, so an unrestored call site faults immediately. The title's own vectored handler is called for that fault and declines it, leaving the code unrestored"
fix       = "none this project will pursue: restoring the elided instructions means defeating the protection, not porting around it. Six other explanations are excluded by measurement -- the container decrypt, a bad download, our image mapping, an OS loader mechanism, the title re-reading its own image, and a missing Windows API"
log-match = "Unhandled illegal instruction at address .* \\(thread"
