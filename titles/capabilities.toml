NtQueryInformationProcess reports the real path of a main image that was mapped \
from a memfd, so a title that asks where its own executable is gets an answer."""
provided-by = ["https://github.com/icex/wine/commit/0ff4c1ee32b1198dfd16197520a1778ef71f179b"]
symptom-if-missing = "GetModuleFileNameEx(GetCurrentProcess(), NULL, ...) returns an empty string; DOOM 64 then calls strlen on what it makes of that and dies before it draws a frame, with rc=3 and nothing in the log"
note = """
Nothing in a recipe can work around this and no title needs to ask for it: the \
