# The runtime's release train: the big, rare one.
#
# Builds the patched Proton -- Wine, the from-scratch Xbox GDK runtime
# (xgameruntime.dll), and everything Proton wraps around them -- and publishes
# the compatibility tool as one tarball. On a hosted four-core runner a build
# takes about two hours cold and 12-15 minutes with a warm compiler cache.
# That is why it is a separate train from the launcher, and why a release
# reuses what main already built instead of building it again.
#
# Runtime sources are public icex forks, locked in sources.lock.json:
#   icex/Proton-UWP -> icex/wine -> icex/xgameruntime
#                  -> icex/vkd3d-proton
# Recursive submodules resolve the same commits checked by source-pins.py.
#
# Jobs, all on GitHub-hosted runners (never the shared self-hosted host, whose
# runner users also run pull request jobs -- docs/RELEASING.md):
#
#   plan     The inputs digest (scripts/runtime-inputs.py): the four runtime
#            pins and scripts/build-runtime.sh. Then whether a push to main
#            already built exactly these inputs; if so, nothing is compiled.
#            A tag waits for a main build of the same inputs that is still
#            running. Read-only token (contents, actions).
#   build    Only when nothing can be reused: scripts/build-runtime.sh, with
#            the compiler cache main saved. Uploads dist.tar.zst and its
#            manifest. A push to main names the artefact runtime-dist-<digest>
#            and saves the cache; nothing else does either.
#   package  Downloads the dist (this run's, or the main run's that `plan`
#            found), checks the zip against the digest GitHub recorded at
#            upload and the manifest against the run, then runs every check on
#            those bytes, writes the capability manifest and makes the .tar.xz.
#   publish  A tag push only: checks, signs and uploads. The one job that can
#            write a release and the only one that sees the minisign key (the
#            `release` environment's MINISIGN_SECRET_KEY and
#            MINISIGN_PASSWORD), as in release.yml. Each signature's trusted
#            comment is `file:<name> version:<version>`. The launcher refuses
#            a runtime whose signature does not verify against the public key
#            built into ferestre-core.
#
# What may be promoted to a tag (runtime-inputs.py `find`, unit-tested in
# tests/test_runtime_inputs.py): only the output of a push to main of this
# workflow, in this repository, whose build job succeeded, at a commit that is
# an ancestor of the tag, whose own sources hash to the tag's digest, from an
# unexpired artefact with a recorded digest. A manual run, a pull request, a
# tag or another workflow never is. So a release ships only what was compiled
# from main-merged sources with a cache only main saved -- the same basis a tag
# build has.
#
# A workflow_dispatch run builds (or reuses) the same tarball and attaches it
# to the run UNSIGNED, and says so; the launcher will not install it. That
# holds for a manual run started on a tag ref too: signing and publishing ask
# for a push. See docs/RELEASING.md.
#
# Cutting a runtime release, after the pins are on main and main's build
# finished:
#
#   git tag -a runtime-11.0.20260907 -m 'what changed' && git push origin runtime-11.0.20260907
#
# The tag's version is what packaging/aur/ferestre-runtime-bin/PKGBUILD expects
# to find at releases/download/runtime-<pkgver>/ferestre-runtime-<pkgver>.tar.xz,
# so it is <proton major>.<minor>.<date> -- pkgver cannot hold the hyphens in
# Proton's own version string.
name: Runtime

on:
  push:
    tags:
      - 'runtime-*'
    # What the runtime is built from, and what checks and describes it. A
    # change that leaves the inputs digest alone costs only `plan` and
    # `package`.
    branches: [main]
    paths:
      - 'sources.lock.json'
      - '.gitmodules'
      - 'scripts/source-pins.py'
      - 'scripts/build-runtime.sh'
      - 'scripts/runtime-inputs.py'
      - 'scripts/write-capabilities.sh'
      - 'scripts/xodus-env.sh'
      - 'titles/capabilities.toml'
      - 'tests/runtime-display-modes.c'
      - 'tests/check-runtime-modes.sh'
      - '.github/workflows/runtime.yml'
  workflow_dispatch:
    inputs:
      proton_ref:
        description: 'Optional unsigned development ref of the pinned Proton fork'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Never cancelled: a main build is what a release promotes and what fills the
# compiler cache, and a tag is a release. Runs of one event on one ref queue,
# and GitHub keeps only the newest waiting one -- so the event is part of the
# group: a manual run on main or on a tag must never replace a waiting push
# run, which is the only kind that saves the cache or makes a promotable dist.
concurrency:
  group: runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    # A tag may wait for main's build of the same inputs.
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      proton_ref: ${{ steps.ref.outputs.proton }}
      pinned: ${{ steps.ref.outputs.pinned }}
      build: ${{ steps.find.outputs.found != 'true' }}
      source_run: ${{ steps.find.outputs.run_id }}
      artifact_id: ${{ steps.find.outputs.artifact_id }}
      artifact_digest: ${{ steps.find.outputs.artifact_digest }}
      source_sha: ${{ steps.find.outputs.head_sha }}
    steps:
      # All of history: `find` recomputes each candidate commit's inputs and
      # checks it is an ancestor of this one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag can be created on any branch, and a release cut from dev would
      # publish work that never reached main.
      - name: The tag must be on main
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main -- merge to main and tag there"
              exit 1
          fi
          echo ":: $GITHUB_REF_NAME is on main"

      # A tag that promotes main's build compiles nothing, so the full lock
      # check -- every fork commit public, its modified paths and its nested
      # gitlinks -- runs here against the tag's own sources.lock.json rather
      # than only in rust.yml on main.
      - name: Verify the tag's source lock
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: scripts/check-sources.sh --remote

      # Only a manual run from a branch may build another Proton commit. A tag
      # push always builds the pin, and a manual run started on a tag ref is
      # refused another ref: its tarball would carry the tag's version.
      - name: Resolve the Proton ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.proton_ref }}
        run: |
          set -euo pipefail
          # Through the environment, not interpolated: a dispatch input is text
          # somebody typed.
          PINNED_REF=$(python3 scripts/source-pins.py get proton commit)
          ref=$PINNED_REF
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$INPUT_REF" ]; then
              if [ "$GITHUB_REF_TYPE" != tag ]; then
                  ref=$INPUT_REF
              elif [ "$INPUT_REF" != "$PINNED_REF" ]; then
                  echo "::error::a manual run on the tag $GITHUB_REF_NAME builds only the pinned Proton $PINNED_REF; start it from a branch to build $INPUT_REF"
                  exit 1
              fi
          fi
          echo "proton=$ref" >> "$GITHUB_OUTPUT"
          if [ "$ref" = "$PINNED_REF" ]; then echo "pinned=true"; else echo "pinned=false"; fi >> "$GITHUB_OUTPUT"

      - name: Inputs digest
        id: digest
        run: |
          set -euo pipefail
          python3 scripts/runtime-inputs.py digest --json
          echo "digest=$(python3 scripts/runtime-inputs.py digest)" >> "$GITHUB_OUTPUT"

      # Only for the pinned Proton: another ref always builds. A tag waits up
      # to five hours for a main build of the same inputs that is running.
      - name: Find a main build of these inputs
        id: find
        if: steps.ref.outputs.pinned == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          WAIT: ${{ github.ref_type == 'tag' && '300' || '0' }}
        run: |
          python3 scripts/runtime-inputs.py find --digest "$DIGEST" --tag-sha "$GITHUB_SHA" \
              --repo "$REPO" --wait-minutes "$WAIT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # The same image the runtime has always been built and tested on.
    runs-on: ubuntu-24.04
    # Two hours cold on a hosted runner; a runner that dies at the default six
    # hours mid-link wastes the whole build rather than reporting anything.
    timeout-minutes: 300
    env:
      # The same absolute path on every hosted runner, which actions/cache
      # needs to find a cache at all and ccache needs to hit: Proton's
      # Makefile mounts this into its container and passes every CCACHE_*
      # variable through.
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 5G
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      # A Proton build tree is ~26 GB and a stock runner has about 25 GB free.
      # The pre-installed toolchains nothing here uses are worth ~30 GB, so
      # this is the difference between building and running out of disk two
      # thirds of the way in -- which presents as a link error, not as a disk
      # error.
      - name: Make room
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      /usr/share/swift /usr/local/lib/node_modules
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ferestre
          # Every configure script and Makefile in the Proton tree runs in
          # this job; none of them needs the token, so none of them gets it.
          persist-credentials: false

      # Saved under the inputs digest and this run (and attempt), so that a
      # retry after a failed or timed-out build saves its own, fuller cache
      # instead of finding the partial one under the same key and saving
      # nothing. Restored from the newest cache of these inputs, else the
      # newest of any: the usual case, a pin that moved since the last build,
      # mostly hits. prune-ccache keeps only the newest.
      - name: Restore the compiler cache
        id: ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.ccache
          key: runtime-ccache-v3-${{ needs.plan.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            runtime-ccache-v3-${{ needs.plan.outputs.digest }}-
            runtime-ccache-v3-

      # Only to read the statistics; the compilers run inside Proton's
      # container, with its own ccache.
      - name: Compiler cache statistics, before
        run: |
          mkdir -p "$CCACHE_DIR"
          du -sh "$CCACHE_DIR"
          sudo apt-get install -y -qq ccache >/dev/null || echo "::notice::no host ccache; no statistics"
          ccache --zero-stats || true

      - name: Build
        env:
          PROTON_REF: ${{ needs.plan.outputs.proton_ref }}
        run: ferestre/scripts/build-runtime.sh "$GITHUB_WORKSPACE/work" "$PROTON_REF"

      - name: Compiler cache statistics, after
        if: always()
        run: |
          ccache --show-stats || true
          du -sh "$CCACHE_DIR" || true

      # Also after a failed build: the objects that did compile are still
      # good, and the next attempt starts from them.
      #
      # Only from a push to main, which always builds the pinned Proton. A
      # manual run may build any Proton ref somebody typed, and that tree's
      # build scripts can write anything into the cache directory; a release
      # build restores this cache, so only reviewed sources may ever fill it.
      # Tags and manual runs restore it and save nothing.
      - name: Save the compiler cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      # What was built, from what, by which run: package checks every field
      # before it uses the dist, and a tag only promotes a main build's.
      - name: Manifest
        env:
          DIGEST: ${{ needs.plan.outputs.digest }}
        run: |
          set -euo pipefail
          python3 ferestre/scripts/runtime-inputs.py manifest --out work/out/manifest.json \
              --digest "$DIGEST" --sdk "$(cat work/out/sdk-image)" --dist work/out/dist.tar.zst \
              --built-proton "$(git -C work/proton rev-parse HEAD)"

      # Only a push to main makes an artefact a tag may promote; any other
      # run's is named after the run and kept a week.
      - name: Upload the dist
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('runtime-dist-{0}', needs.plan.outputs.digest) || format('runtime-dist-run-{0}', github.run_id) }}
          path: |
            work/out/dist.tar.zst
            work/out/manifest.json
          if-no-files-found: error
          # Already zstd.
          compression-level: 0
          retention-days: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 30 || 7 }}

  # Every check on the exact bytes that ship, whether this run built them or a
  # main run did, then the tarball.
  package:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      proton: ${{ steps.dist.outputs.proton }}
      wine: ${{ steps.dist.outputs.wine }}
      xgameruntime: ${{ steps.dist.outputs.xgameruntime }}
      source_run: ${{ steps.dist.outputs.run_id }}
      digest: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ferestre
          persist-credentials: false

      # Downloaded through the API rather than download-artifact, so that the
      # zip is checked against the SHA-256 GitHub recorded when it was
      # uploaded, and the manifest against the run that uploaded it.
      - name: Fetch and check the dist
        id: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILT_HERE: ${{ needs.plan.outputs.build }}
          DIGEST: ${{ needs.plan.outputs.digest }}
          PINNED: ${{ needs.plan.outputs.pinned }}
          THIS_ARTIFACT: ${{ needs.build.outputs.artifact_id }}
          THIS_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          SOURCE_RUN: ${{ needs.plan.outputs.source_run }}
          SOURCE_ARTIFACT: ${{ needs.plan.outputs.artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.plan.outputs.artifact_digest }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$BUILT_HERE" = true ]; then
              run=$GITHUB_RUN_ID artifact=$THIS_ARTIFACT api_digest=sha256:${THIS_ARTIFACT_DIGEST#sha256:}
              sha=$GITHUB_SHA ref=$GITHUB_REF
          else
              run=$SOURCE_RUN artifact=$SOURCE_ARTIFACT api_digest=$SOURCE_ARTIFACT_DIGEST
              sha=$SOURCE_SHA ref=refs/heads/main
              echo "::notice::promoting the dist main built in run $run at $sha (artefact $artifact)"
          fi
          # GitHub's own record, not the value passed between jobs.
          recorded=$(gh api "repos/$REPO/actions/artifacts/$artifact" --jq .digest)
          if [ "$recorded" != "$api_digest" ]; then
              echo "::error::artefact $artifact is recorded as $recorded, expected $api_digest"
              exit 1
          fi
          mkdir -p dl
          gh api "repos/$REPO/actions/artifacts/$artifact/zip" > dl/dist.zip
          unzip -q dl/dist.zip -d dl
          expect=()
          if [ "$PINNED" = true ]; then
              expect=(--expect-proton "$(python3 ferestre/scripts/source-pins.py get proton commit)")
          fi
          python3 ferestre/scripts/runtime-inputs.py check --zip dl/dist.zip --api-digest "$recorded" \
              --manifest dl/manifest.json --dist dl/dist.tar.zst --digest "$DIGEST" \
              --run-id "$run" --head-sha "$sha" --ref "$ref" --repo "$REPO" "${expect[@]}"
          {
              echo "run_id=$run"
              python3 - dl/manifest.json <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          c = m['inputs']['components']
          print(f"proton={m['built_proton']}")
          print(f"wine={c['wine']['commit']}")
          print(f"xgameruntime={c['xgameruntime']['commit']}")
          print(f"sdk={m['sdk_image']}")
          PY
          } >> "$GITHUB_OUTPUT"
          mkdir -p tree
          zstd -dc dl/dist.tar.zst | tar -x -C tree
          {
              echo "### Runtime dist"
              echo "Built by run $run at \`$sha\`, artefact $artifact (\`$recorded\`), inputs digest \`$DIGEST\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # The `proton` script Valve ships closes inherited descriptors before
      # exec, and the client hands Wine a memfd holding the decrypted
      # executable. Without this every GDK title fails to launch with exit
      # code 1, so a runtime without it is not a runtime this launcher can use.
      #
      # The pinned fork already contains inherited-descriptor support; verify
      # that the build copied that script into the distribution.
      - name: Keep inherited descriptors
        run: grep -q close_fds=False tree/dist/proton

      - name: Verify native Wayland drivers and prefix templates
        run: |
          set -euo pipefail
          cd tree/dist/files
          for arch in x86_64 i386; do
              test -s "lib/wine/$arch-unix/winewayland.so"
              test -s "lib/wine/$arch-windows/winewayland.drv"
              strings "lib/wine/$arch-unix/winewayland.so" > "$RUNNER_TEMP/wayland-$arch-strings"
              grep -q wp_fractional_scale_manager_v1 "$RUNNER_TEMP/wayland-$arch-strings"
          done
          test -s share/default_pfx/drive_c/windows/system32/winewayland.drv
          test -s share/default_pfx/drive_c/windows/syswow64/winewayland.drv

      - name: Verify practical resolutions through Wine's display API
        env:
          SDK: ${{ steps.dist.outputs.sdk }}
        run: |
          set -euo pipefail
          test -n "$SDK"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" "$SDK" \
              bash "$GITHUB_WORKSPACE/ferestre/tests/check-runtime-modes.sh" \
              "$GITHUB_WORKSPACE/tree/dist"

      # What the runtime can do, measured against the tree that ships rather
      # than asserted from the source manifest. The launcher reads this to
      # decide whether a title can run at all; a runtime that ships without it
      # makes the launcher fall back to probing, which finds a third of the
      # capabilities and tells the user every title "may not start".
      - name: Write the capability manifest
        run: |
          set -euo pipefail
          cd ferestre
          XODUS_PROTON_DIR="$GITHUB_WORKSPACE/tree/dist" scripts/write-capabilities.sh
          cat "$GITHUB_WORKSPACE/tree/dist/files/share/ferestre/capabilities.json"
          python3 -c 'import json, sys; assert "graphics.native-wayland" in json.load(open(sys.argv[1]))["capabilities"], "built runtime lacks native Wayland capability"' \
              "$GITHUB_WORKSPACE/tree/dist/files/share/ferestre/capabilities.json"

      - name: Version
        id: version
        env:
          PROTON: ${{ steps.dist.outputs.proton }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
              version=${GITHUB_REF_NAME#runtime-}
          else
              version="0.0.$(date -u +%Y%m%d)+${PROTON:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo ":: runtime $version"

      # xz rather than zstd, because ferestre-runtime-bin's PKGBUILD names a
      # .tar.xz and makepkg unpacks by extension. The directory inside is
      # ferestre-runtime-<version>, which that PKGBUILD checks for by name and
      # complains about clearly when it is missing. Multi-threaded xz: one
      # thread took eight and a half minutes.
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          mv tree/dist "tree/ferestre-runtime-$VERSION"
          XZ_OPT=-T0 tar --sort=name --owner=0 --group=0 --numeric-owner \
              -C tree -cJf "out/ferestre-runtime-$VERSION.tar.xz" \
              "ferestre-runtime-$VERSION"
          cd out
          sha256sum ./*.tar.xz > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Unsigned build
        if: github.event_name != 'push' || github.ref_type != 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          msg="runtime $VERSION was built by a manual run or a push to main and is UNSIGNED; ferestre install-runtime refuses it. Only a runtime-* tag signs and publishes."
          echo "::notice::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferestre-runtime-${{ steps.version.outputs.version }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
          # A 300 MB artefact on every run adds up; a tag's copy lives on the
          # release instead.
          retention-days: 14

  # One compiler cache is enough, and two would crowd out everything else
  # in the repository's 10 GB: drop every runtime cache but the newest. Its
  # token can delete caches and nothing else, and it runs no build.
  prune-ccache:
    needs: build
    if: always() && needs.build.result != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Keep only the newest compiler cache
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh cache list --key runtime-ccache- --sort created_at --order desc \
              --limit 100 --json id,key --jq '.[1:][] | .id' |
          while read -r id; do
              echo ":: deleting compiler cache $id"
              gh cache delete "$id"
          done

  # always(): when main's build is promoted, `build` is skipped, and without
  # it GitHub would skip everything downstream of a skipped job -- the tag
  # run would end green with nothing published. The results are checked
  # instead.
  publish:
    needs: [plan, package]
    if: always() && needs.plan.result == 'success' && needs.package.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # Where the signing secrets live; see release.yml and docs/RELEASING.md.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The signing script, and the key the launcher at this commit
          # trusts.
          sparse-checkout: |
            packaging
            crates/ferestre-core/src

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ferestre-runtime-${{ needs.package.outputs.version }}
          path: out

      - name: minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      # Checks SHA256SUMS, then signs the tarball and the sums. The key has to
      # be the one ferestre-core's signing.rs carries (RELEASE_PUBLIC_KEY), or
      # every launcher would refuse this runtime; a placeholder there stops
      # the release here.
      - name: Sign
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          FERESTRE_EXPECT_PUBKEY_IN: crates/ferestre-core/src/signing.rs
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          tag_version=${GITHUB_REF_NAME#runtime-}
          if [ "$tag_version" != "$VERSION" ]; then
              echo "::error::built as $VERSION, but the tag $GITHUB_REF_NAME says $tag_version"
              exit 1
          fi
          packaging/sign-release.sh out "$tag_version"
          ls -lh out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          PROTON_COMMIT: ${{ needs.package.outputs.proton }}
          WINE_COMMIT: ${{ needs.package.outputs.wine }}
          XGR_COMMIT: ${{ needs.package.outputs.xgameruntime }}
          SOURCE_RUN: ${{ needs.package.outputs.source_run }}
          DIGEST: ${{ needs.package.outputs.digest }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "runtime $VERSION" \
            --notes "
          The patched Proton runtime: Wine, the from-scratch Xbox GDK runtime
          (\`xgameruntime.dll\`), and Proton around them.

          Install it with \`ferestre install-runtime\`, or extract the tarball
          into \`~/.steam/steam/compatibilitytools.d/\`. The
          \`ferestre-runtime-bin\` AUR package fetches this file. Each file
          has a minisign signature beside it (\`.minisig\`).

          Built from pinned commits, not branches:

          | Component | Commit |
          |---|---|
          | icex/Proton-UWP | \`$PROTON_COMMIT\` |
          | icex/wine | \`$WINE_COMMIT\` |
          | icex/xgameruntime | \`$XGR_COMMIT\` |

          with the fork commits in \`sources.lock.json\` at this tag. \`capabilities.json\`
          inside the tarball says what this build actually provides, measured
          against the built tree rather than taken from source history.

          Compiled by run $SOURCE_RUN of this workflow (inputs digest \`$DIGEST\`).
          "
