# The launcher's own tests. Two jobs, because they need different things.
#
# `test` is the fast one: everything decided in `ferestre-core` and in the GUI's
# `model` is pure, so it runs anywhere with a Rust toolchain -- no display, no
# runtime, no Microsoft account, no game.
#
# `gui` drives the real window through AT-SPI, which needs a display server and
# the accessibility bus. It is the only thing that can catch a row that renders
# with the wrong label or a button wired to nothing, and it is worth the extra
# minute of setup.
#
# Every job here runs with a read-only token that is not written to the
# checkout, and every third-party action is pinned to a commit, because a tag
# or a branch can be moved to code nobody reviewed. Every cargo call is
# --locked: CI tests the dependency versions in Cargo.lock, which are the ones
# a release ships.
name: Rust

on:
  push:
    # dev as well as main. Work lands on dev and only reaches main to be
    # released, so a filter naming main alone would mean every ordinary
    # push ran no checks at all -- and the checks would come back exactly
    # when the work was already finished.
    branches: [main, dev]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/gui_smoke.py'
      - 'tests/gui_accounts.py'
      - 'tests/gui_client_deps.py'
      - 'tests/fake_packagekit.py'
      - 'tests/test_download_cancel.py'
      - 'tests/test_media_dependencies.py'
      - 'tests/test_client_dependencies.py'
      - 'tools/**'
      - 'tests/endpoint_suite.py'
      - 'titles/**'
      # The `patches` job below is the only thing that checks these, and a
      # patch-only commit is exactly the kind that breaks them.
      - 'patches/**'
      # All of scripts/, not a list: the shim sources xodus-env.sh on every
      # launch, launch-core tests read launch-gdk.sh, and the shell syntax step
      # covers the rest. A list left out exactly the files a change to one
      # would break.
      - 'scripts/**'
      - 'packaging/**'
      - 'tests/test_real_path_image_view.py'
      - 'tests/test_caller_ids_image_view.py'
      - 'tests/test_proton_wine_shim.py'
      - 'tests/test_fix_xcurl.py'
      - 'tests/test_launch_gdk.py'
      - 'tests/test_install_xodus_proton.py'
      - 'tests/test_build_appimage.py'
      - 'tests/test_release_signing.py'
      - 'tests/test_workflows.py'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/gui_smoke.py'
      - 'tests/gui_accounts.py'
      - 'tests/gui_client_deps.py'
      - 'tests/fake_packagekit.py'
      - 'tests/test_download_cancel.py'
      - 'tests/test_media_dependencies.py'
      - 'tests/test_client_dependencies.py'
      - 'tools/**'
      - 'tests/endpoint_suite.py'
      - 'titles/**'
      # The `patches` job below is the only thing that checks these, and a
      # patch-only commit is exactly the kind that breaks them.
      - 'patches/**'
      # All of scripts/, not a list: the shim sources xodus-env.sh on every
      # launch, launch-core tests read launch-gdk.sh, and the shell syntax step
      # covers the rest. A list left out exactly the files a change to one
      # would break.
      - 'scripts/**'
      - 'packaging/**'
      - 'tests/test_real_path_image_view.py'
      - 'tests/test_caller_ids_image_view.py'
      - 'tests/test_proton_wine_shim.py'
      - 'tests/test_fix_xcurl.py'
      - 'tests/test_launch_gdk.py'
      - 'tests/test_install_xodus_proton.py'
      - 'tests/test_build_appimage.py'
      - 'tests/test_release_signing.py'
      - 'tests/test_workflows.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The GUI crate links GTK4 and libadwaita, so the workspace needs them
      # even to type-check.
      # minisign for the release signing tests, shellcheck for the shell
      # syntax step, PyYAML for the workflow checks.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev minisign shellcheck python3-yaml

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Download cancellation (offline)
        run: cargo build --locked -p ferestre-cli && python3 tests/test_download_cancel.py && python3 tests/test_media_dependencies.py && python3 tests/test_client_dependencies.py

      # Ubuntu's runners restrict unprivileged user namespaces through
      # AppArmor, and the image-view tests skip themselves where the namespace
      # probe fails -- which would leave the code that keeps decrypted game
      # files private untested behind a green tick. Lift the restriction for
      # this runner, and tell the tests a skip is a failure here.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount true

      - name: Launch helper tests
        env:
          FERESTRE_REQUIRE_USERNS: '1'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*image_view.py'
          python3 tests/test_proton_wine_shim.py
          python3 tests/test_fix_xcurl.py
          python3 tests/test_launch_gdk.py
          python3 tests/test_install_xodus_proton.py

      # Syntax for every shell script, under the shell its #! names: the shim
      # and xodus-env.sh run under /bin/sh, which is dash here, so a bashism
      # in them is caught by sh -n and would otherwise only show at launch.
      # shellcheck at error severity on top, which finds what -n cannot (an
      # unquoted array, a test that is always true) without failing on style.
      - name: Shell syntax
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
              case "$(head -n1 "$f")" in
                  *bash*) shell='bash' ;;
                  '#!/bin/sh'*|'#!/usr/bin/env sh'*) shell='sh' ;;
                  *) case "$f" in *.sh) shell='sh' ;; *) continue ;; esac ;;
              esac
              "$shell" -n "$f" || status=1
              shellcheck --severity=error --shell="$shell" "$f" || status=1
          done < <(find scripts packaging tests -type f \( -name '*.sh' -o -name AppRun \) -print0)
          exit "$status"

      - name: Packaging and release tests
        env:
          FERESTRE_REQUIRE_MINISIGN: '1'
        run: |
          python3 tests/test_workflows.py
          python3 tests/test_release_signing.py
          python3 tests/test_build_appimage.py

      - name: Developer tool tests (offline)
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  # The cheap half of testing the runtime. Building it needs a 26 GB tree and an
  # hour, so `tests/run-*.sh` cannot run per push -- but checking that the
  # patches still apply takes a minute, and it is the check that has actually
  # caught things: a patch exported from a dirty tree carrying its predecessor's
  # changes (twice), and a rename leaking into a third-party project's source.
  #
  # Only the series whose repositories are small enough to clone here. The wine
  # series needs the Wine tree and stays a local check; the script skips what it
  # cannot find rather than failing.
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The client is a submodule pinned at the commit the series targets.
      # The Proton submodule's own submodules are not initialised: its Wine
      # tree is too large to clone per push, and the wine series stays a
      # local check. Proton itself is cloned without blobs, for the proton
      # patch; the xgameruntime and vkd3d-proton trees are small enough, so
      # they are cloned into the places the submodules would put them.
      - name: Fetch the repositories the patches target
        run: |
          git submodule update --init --quiet third_party/xodus-cli
          git clone --quiet --filter=blob:none https://github.com/xodus-gaming/Proton.git \
            third_party/xodus-proton
          git clone --quiet https://github.com/xodus-gaming/xgameruntime \
            third_party/xodus-proton/wine/dlls/xgameruntime
          # Without blobs: the history is needed to find the pinned base, but
          # only that commit's files are ever read, and they arrive on demand.
          git clone --quiet --filter=blob:none https://github.com/HansKristian-Work/vkd3d-proton \
            third_party/xodus-proton/vkd3d-proton

      - name: Patches apply
        run: scripts/check-patches.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - name: Service test dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev protobuf-compiler

      - name: Fixture script syntax
        run: |
          bash -n tests/run-tests.sh tests/build-license-service-fixture.sh
          python3 -m py_compile tests/license_token_fixture.py

      - name: Apply the client series and test the service offline
        run: |
          for patch in "$GITHUB_WORKSPACE"/patches/xodus-cli/*.patch; do
            case "$(basename "$patch")" in 0001-*) continue ;; esac
            git -C third_party/xodus-cli apply "$patch"
          done
          cd third_party/xodus-cli
          cargo test --locked -p xodus-service
          cargo test --locked -p xodus profile

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev \
            at-spi2-core gir1.2-atspi-2.0 python3-gi \
            xvfb dbus-x11

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the window
        run: cargo build --locked -p ferestre-gui -p ferestre-cli

      # A session bus for the accessibility bus to live on, a display for the
      # window to map into, and then the test drives it by pressing things.
      - name: Smoke test
        run: |
          xvfb-run -a --server-args='-screen 0 1280x900x24' \
            dbus-run-session -- python3 tests/gui_smoke.py

      - name: Separate Store and Player accounts (offline)
        run: |
          xvfb-run -a --server-args='-screen 0 1280x900x24' \
            dbus-run-session -- python3 tests/gui_accounts.py

      # PackageKit is a fake on a private bus standing in for the system one,
      # and the missing library is a fixture, so this installs nothing.
      - name: Missing WebKitGTK offered for install (offline)
        run: |
          xvfb-run -a --server-args='-screen 0 1280x900x24' \
            dbus-run-session -- python3 tests/gui_client_deps.py
