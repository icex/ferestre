name: "Title report: it does not work"
description: A Store / GDK title that does not download, does not start, or breaks partway.
title: "[fails] "
labels: ["title-report", "does-not-work"]
body:
  - type: markdown
    attributes:
      value: |
        **Most titles do not work, and that is the expected result today.** Three
        have been tried. The GDK runtime here implements what those three
        happened to call, so a fourth title asking for something else is news,
        not a nuisance. A clear failure report is worth as much as a success
        report — it is usually one log line away from being a fix.

        Two things make a report useless: not saying where it stopped, and not
        including the log line that says why. "Does not launch" cannot be acted
        on. "No window, last line `Failed to Register TaskQueue Monitor`" points
        at one function.

        ### Do not paste account identifiers, tokens or game content

        A launch log contains **your gamertag, your XUID and your save-folder
        ids**, and with verbose logging it contains Xbox Live tokens as well. A
        token in a public issue is a live credential until it expires. Run the
        log through this, then read the result before pasting it:

        ```sh
        sed -E \
          -e 's/\b[0-9]{16}\b/<redacted>/g' \
          -e 's/\b[0-9a-fA-F]{16}_/<redacted>_/g' \
          -e 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9._-]+/<redacted>/g' \
          -e 's/(XBL3\.0 x=)[^;" ]*/\1<redacted>/g' \
          -e 's/(Bearer )[A-Za-z0-9._~+\/=-]{12,}/\1<redacted>/g' \
          -e 's/YourGamertag/<gamertag>/gI' \
          ~/xbox-games/<title>-launch.log > /tmp/report.log
        ```

        A pattern catches shapes, not everything: replace `YourGamertag` with
        yours, and check the output by eye. Never attach a package, a `.msixvc`,
        a licence, a content key or a save file.

  - type: input
    id: title-name
    attributes:
      label: Title
      description: As the Microsoft Store spells it.
      placeholder: Forza Horizon 5
    validations:
      required: true

  - type: input
    id: product-id
    attributes:
      label: Store product id
      description: >
        The last part of the Store URL —
        https://apps.microsoft.com/detail/9NBLGGH2JHXJ gives 9NBLGGH2JHXJ.
      placeholder: 9NBLGGH2JHXJ
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where it stopped
      description: The nearest one. The detail goes in the next two fields.
      options:
        - Download or decrypt never finished
        - No window at all — the process exits immediately
        - A window appears, then it exits or hangs before any menu
        - Reaches a menu, but cannot sign in or has no network
        - Plays, but something significant is broken (crash, no video, no saves, no input)
        - Something else
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: The last thing it said before it stopped
      description: >
        The actual error text, not a summary of it. If the title printed nothing,
        say so and give the exit code from the launch script.
      placeholder: |
        Critical Failure: GameInput Runtime could not be loaded
        === exited rc=1 ===
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Redacted log excerpt
      description: >
        About fifty lines around the failure, from
        WINEDEBUG=+debugstr scripts/launch-gdk.sh ... — +debugstr is by far the
        most useful channel for a GDK title, because the title's own
        [INFO]/[ERROR] lines name the API that failed. Redacted, and not the
        whole file: fifty lines is what gets read.
      render: text

  - type: textarea
    id: tried
    attributes:
      label: What you already tried
      description: >
        Especially anything from the troubleshooting table in RECIPES.md. Saying
        which fixes did not help narrows it as much as the error itself does.
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime version
      description: 'cat "$XODUS_PROTON_DIR/version" — or the version file in compatibilitytools.d/xodus'
      placeholder: 1788593799 xodus-bleeding-edge-11.0-20260803-3-g7c0b4354
    validations:
      required: true

  - type: input
    id: repo-commit
    attributes:
      label: xgdk-launcher commit
      description: git rev-parse --short HEAD
      placeholder: 35fe31c
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution and kernel
      description: '. /etc/os-release; echo "$PRETTY_NAME $(uname -r)"'
      placeholder: Ubuntu 24.04.1 LTS 6.8.0-45-generic
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: 'vulkaninfo --summary | grep -E "deviceName|driverName|driverInfo"'
      placeholder: AMD Radeon RX 9070 XT, radv, Mesa 26.2.2
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I own this title on the Microsoft account I used, or it is covered by my Game Pass entitlement.
          required: true
        - label: I read the troubleshooting table in docs/RECIPES.md and my failure is not one of the ones already listed there.
          required: true
        - label: There is no gamertag, XUID, PFID, token, licence or content key anywhere in this report, and I checked the log by eye after redacting it.
          required: true
        - label: I have attached no game content — no package, no .msixvc, no save file.
          required: true
