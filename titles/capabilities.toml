symptom-if-missing = "the title faults one instruction after the call, on `movups xmm0,[rax]` -- Goat Simulator 3 does exactly that and exits 3"
note = """
The API returns a struct by value, which in this ABI means the caller passes the \
buffer and expects the same pointer back. Returning NULL on a failure path is \
therefore a null dereference in the *title*, one instruction later, with nothing \
in the log to say why. There is no failure path where NULL is a legal answer."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "Desktop" },
]

[[capability]]
name = "xgameruntime.task-queue-lifetime"
summary = "A task queue terminates when told to, and an async result never reports success without writing what it promised."
provided-by = ["https://github.com/icex/xgameruntime/commit/4f0d8dadf943a165a71c8d89cbe7f56b23b8f3bf"]
symptom-if-missing = "callbacks run after the title was told none would, against objects it has already freed; and a second XAsyncGetResult returns S_OK with the caller's buffer untouched"
note = """
Three defects an adversarial audit of this runtime confirmed. The queue runner \
was launched through CreateThread with a thread-pool callback's two-argument \
signature, so the queue pointer it used was whatever the ABI left in the second \
register. XTaskQueueTerminate drained an unrelated process-wide list and fired \
the terminated callback immediately, leaving the queue's own callbacks to run \
afterwards with `canceled` FALSE -- that callback is exactly the signal a title \
acts on to free the objects those callbacks touch."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "completed with no payload" },
]

[[capability]]
name = "xgameruntime.async-block-ownership"
summary = "XAsyncComplete refuses a block this runtime never began, instead of writing a result into whatever the pointer happens to be."
provided-by = ["https://github.com/icex/xgameruntime/commit/bad1197b45e4347c8c3e0e24d3b4f8665297bc0a"]
symptom-if-missing = "a fault inside xgameruntime.dll on the first dereference of the async block -- Age of Empires: Definitive Edition dies on the way into a match"
note = """
libHttpClient nests two async operations per HTTP call, and its error path \
completes a third block that it never initialised: observed arriving as NULL, \
as 0xfffffffffffffffe, and as 0x0000090b32e048a4, the last with result \
0x80190190 -- HTTP 400 as an HRESULT. Completing a block means writing the \
result into it, so an uninitialised pointer faults on the first store, inside \
this dll, which reads as a runtime bug rather than as a caller passing \
something that was never an XAsyncBlock.

The operation list is the arbiter: XAsyncComplete means nothing for a block \
XAsyncBegin did not start, so a block with no operation behind it is refused \
and named in the log rather than dereferenced."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "a block this runtime never began" },
]

