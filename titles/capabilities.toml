[[capability]]
name = "xgameruntime.async-provider-completed-in-begin"
summary = """
An XAsync operation completed inside its provider's Begin keeps its result \
and defers callback delivery while that provider call runs."""
provided-by = ["https://github.com/icex/xgameruntime/commit/a64fca67f4217801de3eb5a2ee7e63f9645eeb63"]
symptom-if-missing = "a title using libHttpClient's WinHttp websocket transport crashes shortly after the socket connects because its completed operation was withdrawn before GetResult could fill the result buffer"
note = """
Wine's WinHttpWebSocketSend can finish inline. libHttpClient completes its \
async block during Begin and then returns E_PENDING. The runtime must preserve \
the accepted result, and the Begin frame holds a reference while the provider \
runs. A missing payload is reported instead of copied from address zero.

This patch alone still returned E_PENDING from XAsyncBegin. The separate \
xgameruntime.async-begin-contract capability corrects that return value and \
the resulting caller teardown."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "operation %p registered for block %p (begin)" },
]

[[capability]]
name = "xgameruntime.async-begin-contract"
summary = """
XAsyncBegin returns S_OK after setup; provider failures complete the operation \
asynchronously and failed-Begin providers are cleaned up without GetResult."""
provided-by = [
    "https://github.com/icex/xgameruntime/commit/a8eff5c44fb493e3c509918b92066e0c3df3ad65",
    "https://github.com/icex/xgameruntime/commit/89de568400f5bf12c117685235401110177ab71d",
]
symptom-if-missing = "libHttpClient treats a provider's E_PENDING as a failed start and tears down context still needed by its queued completion; Forza Horizon 5 faults reading 0xFFFFFFFFFFFFFFFF in its websocket completion handler"
note = """
Provider E_PENDING leaves the operation pending and an inline completion keeps \
its first result. A returned provider failure is recorded for GetStatus and \
GetResult; it is not returned to the caller of a successfully set-up Begin. \
Failed-Begin cleanup waits for the provider and completion callback, using an \
owned block snapshot because the callback may free the caller's block. A \
reused block still reports its newest failure rather than an older result."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "for block %p completes asynchronously; cleanup follows delivery" },
]

[[capability]]
