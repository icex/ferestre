# The launcher's release train: the small, frequent one.
#
# Three artefacts, all x86_64 Linux:
#
#   ferestre-<version>-x86_64.tar.zst   the tree an installed copy has, so the
#                                       binary finds its scripts, patches and
#                                       recipes exactly the way the AUR package
#                                       lays them out -- usr/bin beside
#                                       usr/lib/ferestre. Extract anywhere.
#   ferestre-<version>-x86_64.AppImage  one file, for people who do not want to
#                                       extract anything.
#   SHA256SUMS                          for both, so a download can be checked.
#   <each of the above>.minisig         minisign signatures, so a download can
#                                       be checked against a key that is not
#                                       published in the same place as the file.
#                                       Tag releases only: see below.
#
# The runtime has its own build train and tag. The GUI downloads its published
# release on first start, so updating the launcher never requires rebuilding
# or embedding a 300 MB Proton archive.
#
# Cutting a release:
#
#   git tag -a v0.1.0 -m 'what changed' && git push origin v0.1.0
#
# A workflow_dispatch run builds and uploads the same artefacts without
# publishing anything, which is how to find out whether a release would build
# before committing to a tag. Those artefacts are UNSIGNED: nothing is signed
# outside a tag push (a manual run started on a tag ref is still a manual run),
# the run says so in its summary, and the launcher refuses an unsigned runtime.
#
# Two jobs, because building runs a great deal of code nobody here wrote: the
# build scripts and proc-macros of every crate in two dependency trees, and the
# actions that set the toolchain up. `build` does all of that with a read-only
# token that is not even written to the checkout. `publish` runs only on a tag
# push, after `build` has succeeded, and does nothing but check, sign and
# upload the artefacts it is handed -- it is the one job that holds a token able
# to write releases, and the only one that sees the signing key.
#
# Signing uses minisign, and happens only on a tag push. The secrets live in the
# GitHub Environment named `release`, not in the repository: MINISIGN_SECRET_KEY
# holds the whole secret key file, and MINISIGN_PASSWORD its password (unset for
# a key made with -W). `publish` is the only job that names that environment,
# so the environment's protection rules (tags only, a required reviewer) gate
# the one job that can read the key. Each signature's trusted comment is
# `file:<name> version:<version>`. The launcher verifies what it downloads
# against the public key built into ferestre-core; packaging/sign-release.sh
# refuses to sign with a key the launcher being published would not accept.
# docs/RELEASING.md covers making, storing and rotating the key.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp the artefacts with (default: the workspace version)'
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The AppImage stamps the build it came from, and a shallow clone
          # cannot describe itself.
          fetch-depth: 0
          # Nothing in this job pushes, so nothing in it needs the token, and
          # every build script it runs could read it from .git/config.
          persist-credentials: false

      # A tag can be created on any branch, and a release cut from dev would
      # publish work that never reached main. Now that there are two branches
      # this is worth one fetch to be sure of.
      - name: The tag must be on main
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git -C "." fetch --quiet --depth=100 origin main
          if ! git -C "." merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main -- merge to main and tag there"
              exit 1
          fi
          echo ":: $GITHUB_REF_NAME is on main"

      # GTK4 and libadwaita because the GUI links them; fuse3 because the
      # AppImage self-test at the end of the packaging script mounts the image
      # it just built, and a build that cannot run its own output has not been
      # tested at all.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            fuse3 libfuse3-3 zstd protobuf-compiler

      # Third-party actions are pinned to a commit: a tag or a branch can be
      # moved to code nobody reviewed.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # A tag is the version, without its leading v. Otherwise the workspace
      # says what it is, and a manual run may override that.
      - name: Version
        id: version
        # Through the environment rather than interpolated into the script:
        # a workflow_dispatch input is text somebody typed, and text somebody
        # typed has no business being pasted into a shell.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
              version=$INPUT_VERSION
          elif [ "${GITHUB_REF_TYPE}" = tag ]; then
              version=${GITHUB_REF_NAME#v}
          else
              version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
              version="$version+$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo ":: building $version"

      # The publish job uses these as the release text, and finding out they
      # are missing after an hour of building helps nobody.
      - name: Release notes
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "docs/RELEASE-$VERSION.md" || {
              echo "::error::docs/RELEASE-$VERSION.md does not exist"
              exit 1
          }
          mkdir -p notes
          cp "docs/RELEASE-$VERSION.md" notes/

      # A release is not the place to discover a broken test. The same suite
      # rust.yml runs per push, run again against the exact tree being shipped.
      # --locked throughout: the release is built from the dependency versions
      # in Cargo.lock, which were reviewed, not whatever crates.io serves today.
      - name: Test
        run: cargo test --locked --workspace

      - name: Build
        run: cargo build --locked --release --workspace

      # A release that opens but cannot sign in is not a usable AppImage. Build
      # the GPL client separately and ship it beside the MIT launcher; the two
      # still communicate solely by process invocation. The same ordered patch
      # series the AUR package applies is used here, so the binary in the image
      # and its corresponding source diffs describe the same client.
      - name: Build bundled Xodus client
        run: |
          set -euo pipefail
          # The submodule pin is the upstream commit the series is written
          # against; scripts/check-patches.sh and the AUR package name the same one.
          git submodule update --init --quiet third_party/xodus-cli
          for patch in patches/xodus-cli/*.patch; do
              case "$(basename "$patch")" in 0001-*) continue ;; esac
              git -C third_party/xodus-cli apply "$GITHUB_WORKSPACE/$patch"
          done
          cargo build --locked --release --manifest-path third_party/xodus-cli/Cargo.toml \
              -p xodus-cli -p xodus-service

      # The layout an installed copy has: usr/bin/ferestre with
      # usr/lib/ferestre beside it. paths.rs looks for its repository root at
      # <binary>/../lib/ferestre before it looks at /usr/lib/ferestre, so this
      # tree works extracted anywhere without being installed -- and it works
      # through the same code path a packaged install uses, rather than a
      # second one that only the tarball exercises.
      - name: Stage the tree
        id: stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          root="stage/ferestre-$VERSION"
          install -d "$root/usr/bin" "$root/usr/lib/ferestre"
          install -Dm755 target/release/ferestre     "$root/usr/bin/ferestre"
          install -Dm755 target/release/ferestre-gui "$root/usr/bin/ferestre-gui"
          install -Dm755 third_party/xodus-cli/target/release/xodus-cli \
              "$root/usr/lib/ferestre/client/xodus-cli"
          install -Dm755 third_party/xodus-cli/target/release/xodus-service \
              "$root/usr/lib/ferestre/client/xodus-service"
          sha256sum "$root/usr/lib/ferestre/client/xodus-service" | cut -d' ' -f1 > "$root/usr/lib/ferestre/client/SERVICE_ID"
          # Not documentation: launch-gdk.sh is the launch path and
          # proton-wine-shim.sh is what the client execs as its "wine".
          # patches/ travels with them because install-xodus-proton.sh reads
          # patches/proton out of the repository root.
          cp -a scripts patches titles "$root/usr/lib/ferestre/"
          find "$root/usr/lib/ferestre/scripts" -name '*.sh' -exec chmod 0755 {} +
          printf '%s\n' "$VERSION" > "$root/usr/lib/ferestre/VERSION"

          id=io.github.icex.ferestre
          install -Dm644 "packaging/appimage/$id.desktop" \
              "$root/usr/share/applications/$id.desktop"
          install -Dm644 "packaging/appimage/$id.metainfo.xml" \
              "$root/usr/share/metainfo/$id.metainfo.xml"
          install -Dm644 "packaging/appimage/$id.png" \
              "$root/usr/share/icons/hicolor/256x256/apps/$id.png"
          if [ -f "packaging/icons/hicolor/scalable/apps/$id.svg" ]; then
              install -Dm644 "packaging/icons/hicolor/scalable/apps/$id.svg" \
                  "$root/usr/share/icons/hicolor/scalable/apps/$id.svg"
          fi

          for doc in README.md NOTICE docs/RELEASE-0.1.13.md docs/RELEASE-0.1.12.md docs/RELEASE-0.1.11.md docs/RELEASE-0.1.10.md docs/RELEASE-0.1.9.md docs/RECIPES.md docs/ROADMAP.md docs/COMPATIBILITY.md docs/AUTODETECTION.md docs/PRESENCE.md docs/PACKAGE-SIGNATURES.md; do
              install -Dm644 "$doc" "$root/usr/share/doc/ferestre/$(basename "$doc")"
          done
          for lic in LICENSE LICENSE.LGPL-2.1; do
              # An `if`, not `[ -f ] && install`: under `set -e` a false test as
              # the last command of a loop body ends the step, and a missing
              # optional licence file would fail the release rather than be
              # skipped.
              if [ -f "$lic" ]; then
                  install -Dm644 "$lic" "$root/usr/share/licenses/ferestre/$lic"
              fi
          done

          mkdir -p out
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              -C stage -caf "out/ferestre-$VERSION-x86_64.tar.zst" "ferestre-$VERSION"
          echo "tarball=out/ferestre-$VERSION-x86_64.tar.zst" >> "$GITHUB_OUTPUT"

      # The script downloads its own pinned appimagetool and type-2 runtime,
      # checks both against recorded hashes, and runs the result once before
      # calling it built. See packaging/appimage/build-appimage.sh for why it
      # never lets appimagetool mount itself.
      - name: AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          packaging/appimage/build-appimage.sh \
            --bin target/release/ferestre \
            --client third_party/xodus-cli/target/release/xodus-cli \
            --version "$VERSION" \
            --out out

      - name: Checksums
        working-directory: out
        run: |
          sha256sum ./*.AppImage ./*.tar.zst > SHA256SUMS
          cat SHA256SUMS

      # Said out loud, because an artefact from a manual run looks exactly
      # like a release's except for the missing .minisig files.
      - name: Unsigned build
        if: github.event_name != 'push' || github.ref_type != 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          msg="ferestre $VERSION was built by a manual run and is UNSIGNED. Only a v* tag signs and publishes."
          echo "::notice::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferestre-${{ steps.version.outputs.version }}
          path: out/*
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: release-notes
          path: notes/*
          if-no-files-found: error

  # Only a tag push publishes. A manual run, even on a tag ref, has produced the same artefacts and
  # attached them to the run, unsigned, which is the point of being able to
  # try.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The signing secrets are environment secrets of `release`. Restrict that
    # environment to v* and runtime-* tags and give it a required reviewer
    # (docs/RELEASING.md), and nothing else can reach the key.
    environment: release
    # The only job that can write a release, so the only one with the token
    # that can. It runs no build and no third-party action beyond fetching
    # the artefacts and this repository's own signing script.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: packaging

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ferestre-${{ needs.build.outputs.version }}
          path: out

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: notes

      - name: minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign zstd

      # Checks SHA256SUMS first, then signs every artefact and the sums. The
      # launcher binary in the tarball has to trust the signing key, or the
      # runtime it downloads would be refused on every machine.
      #
      # The version in the trusted comment is the tag's, and the artefacts
      # must carry the same one.
      - name: Sign
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$tag_version" != "$VERSION" ]; then
              echo "::error::built as $VERSION, but the tag $GITHUB_REF_NAME says $tag_version"
              exit 1
          fi
          launcher="$RUNNER_TEMP/launcher"
          mkdir -p "$launcher"
          tar -xaf "out/ferestre-$VERSION-x86_64.tar.zst" -C "$launcher" \
              "ferestre-$VERSION/usr/bin/ferestre"
          FERESTRE_EXPECT_PUBKEY_IN="$launcher/ferestre-$VERSION/usr/bin/ferestre" \
              packaging/sign-release.sh out "$tag_version"
          ls -l out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Publish the complete checked-in changes and qualification limits.
          # Keeping a second abbreviated changelog here used to omit fixes.
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "ferestre $VERSION" \
            --notes-file "notes/RELEASE-$VERSION.md"
