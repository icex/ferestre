# The launcher's own tests. Separate jobs, because they need different things.
#
# `test` is the fast one: everything decided in `ferestre-core` and in the GUI's
# `model` is pure, so it runs anywhere with a Rust toolchain -- no display, no
# runtime, no Microsoft account, no game.
#
# `msrv` builds and tests the same workspace with the oldest compiler it claims
# to support, the `rust-version` in Cargo.toml, so that claim cannot quietly go
# stale when Cargo.lock moves a dependency onto a newer one.
#
# `gui` drives the real window through AT-SPI, which needs a display server and
# the accessibility bus. It is the only thing that can catch a row that renders
# with the wrong label or a button wired to nothing, and it is worth the extra
# minute of setup.
#
# Where each job runs, and why:
#
# - The self-hosted runners share one host that lets four jobs build at once,
#   and every job there is a slot another pull request waits for. Only `test`
#   runs there (FERESTRE_RUNNER_LABELS), in a build directory that outlives
#   the job (.github/scripts/ci-target-dir.sh), so only what changed is
#   rebuilt. Set the variable to '["ubuntu-24.04"]' and it runs hosted, with
#   the GitHub cache instead.
# - Everything else is hosted and never waits for a slot: `preflight`
#   (rustfmt, and on a pull request which of msrv, gui and sources the change
#   can affect -- .github/scripts/ci-changes.sh; a push to main or dev, or a
#   manual run, runs them all), `msrv`, `sources`, and the window, which is
#   built once (`gui-build`) and tested in four shards at once (`gui`,
#   tests/run_gui_ci.py). Hosted jobs restore the GitHub cache and save it
#   from main only.
# - On a pull request, msrv type-checks with the old compiler instead of
#   building and running every test a second time. The full msrv test runs on
#   every push to main and dev.
# - A newer push to a pull request cancels its older run. Main, dev, tags and
#   manual runs are never cancelled.
#
# Neither the persistent directory nor these caches reach a release: release
# and runtime builds run on hosted runners in a clean checkout
# (docs/RELEASING.md).
#
# Every job here runs with a read-only token that is not written to the
# checkout, and every third-party action is pinned to a commit, because a tag
# or a branch can be moved to code nobody reviewed. Every cargo call is
# --locked: CI tests the dependency versions in Cargo.lock, which are the ones
# a release ships.
# Keep the tested system libraries and the release glibc baseline stable when
# ubuntu-latest moves to a newer distribution.
name: Rust

on:
  push:
    # dev as well as main. Work lands on dev and only reaches main to be
    # released, so a filter naming main alone would mean every ordinary
    # push ran no checks at all -- and the checks would come back exactly
    # when the work was already finished.
    branches: [main, dev]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/gui_smoke.py'
      - 'tests/gui_accounts.py'
      - 'tests/gui_presence.py'
      - 'tests/gui_client_deps.py'
      - 'tests/gui_updater.py'
