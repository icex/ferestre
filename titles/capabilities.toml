[[capability]]
name = "xgameruntime.save-provider-default-scid"
summary = """
A save provider initialised with an all-zero configuration id uses the title's \
own service configuration, derived from its title id."""
provided-by = ["https://github.com/icex/xgameruntime/commit/3a33eb73b048b521de4b1cb56cc0868b3e8118cb"]
symptom-if-missing = "a title that passes zeros gets a save folder named for a zero SCID, so a profile copied over from Windows -- or written by an earlier run -- is invisible and it starts as though it had never been played"
note = """
An all-zero configuration id means "the one this title was built with", not a \
service configuration whose every digit is zero. Forza Horizon 5 passes zeros \
and then reads User_<xuid>/ProfileBackup, which used to land in \
wgs\\0000000000000000_000...000 rather than the folder named for SCID \
...7900C3C7. The default follows the convention every title id-scoped SCID \
uses: the last eight digits are the title id, everything before them zero. A \
title whose config carries no title id keeps the zero suffix, since there is \
nothing better to say and refusing to open a provider would be worse."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "title named no service configuration; using its own" },
]

[[capability]]
name = "xgameruntime.store-current-game-product"
summary = """
XStore reports the running game as a product the player owns, rather than \
answering every product query with an empty result."""
provided-by = ["https://github.com/icex/xgameruntime/commit/38480afc3804b180d66b1e3862ca040266e69a8d"]
symptom-if-missing = "a title asking what its own product is, or which games it is entitled to, is told it does not exist"
note = """
The one product that can be described honestly offline is the game running now: \
its store id, title and description come from MicrosoftGame.config, and \
isInUserCollection is true because the person is playing it -- the image was \
decrypted with their own licence to get this far. Nothing is claimed about \
add-ons; those really are unknown without the store, and inventing them would \
be worse than saying nothing, so a query for durables, passes or consumables \
still comes back empty.

Honesty rather than a measured win: Forza Horizon 5 only ever asks for \
Durable|Pass and Consumable|UnmanagedConsumable, so it does not exercise this. \
No title has yet been seen to need it. It is here because \
XStoreQueryProductForCurrentGameAsync answering "no such product" is wrong on \
its own terms."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "reporting the running game as a product" },
]

[[capability]]
name = "xnetworking.tls-protocol-flags"
summary = """
XNetworkingQuerySecurityInformationForUrl reports the TLS versions the HTTP \
stack may use, instead of a mask with nothing set."""
provided-by = ["https://github.com/icex/xgameruntime/commit/4cc07f29957b4b0da703ba570aeb8bf1d0c7ae0c"]
symptom-if-missing = "a title that follows the documented pattern configures its WinHTTP session to permit no TLS version at all"
note = """
The GDK documents `enabledHttpSecurityProtocolFlags` as a \
WINHTTP_FLAG_SECURE_PROTOCOL_* mask to be passed straight to \
WinHttpSetOption( WINHTTP_OPTION_SECURE_PROTOCOLS ) for the URL it was asked \
about. Reporting zero is not "no preference", it is "no protocol is allowed", \
and a title doing exactly what the documentation says with it has configured \
its session to refuse every handshake.

TLS 1.2 and 1.3, which is what a current policy allows and what the services \
these titles talk to negotiate. There are still no thumbprints, because there \
is nothing to pin: XNetworkingVerifyServerCertificate verifies the request's \
certificate chain against its host, as WinHTTP does, and no more \
(https://github.com/icex/xgameruntime/commit/c68bdd47d0a7cda65cba4ec02be67f2253c4e271).

Found while chasing Forza Horizon 5 and it did not change its outcome; kept \
because a mask of zero is wrong on its own terms."""
verify = [
    { file = "files/lib/wine/x86_64-windows/xgameruntime.dll", contains = "XNetworkingQuerySecurityInformationForUrlUtf16Async" },
]

