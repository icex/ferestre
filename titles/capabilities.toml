# Runtime capability registry
#
# A recipe says what a title needs from the runtime, never which runtime build
# it needs. These are the names it may use. Each one is a behaviour a title can
# observe: something it calls, or something that has to succeed before it will
# start. A runtime that provides all of a title's `requires` can run it,
# whichever Proton or Wine version it was built from.
#
# Adding a name here is a promise: the runtime must keep providing it, or drop
# it deliberately and update every recipe that asks for it. Do not add a name
# for a debugging aid (https://github.com/icex/wine/commit/90a9bbbffab33f330a813d761254f87718efbf00 adds a WINEDEBUG
# channel, not a capability) -- only for something a title depends on.
#
# `symptom-if-missing` is what you see when the runtime does not have it. It is
# the field that makes a failed launch diagnosable by someone who was not there
# when it was first found.
#
# `verify` is how a build proves it has the capability rather than claiming it:
# a file inside the installed runtime and a string that only appears there once
# the patch is in. Every marker below was chosen by finding it in a real build
# and confirming it is absent without the patch -- a marker that is present
# upstream too would turn the manifest back into a promise. All markers of a
# capability must match; `loader.memfd-main-image` needs two patches and so has
# two. `scripts/write-capabilities.sh` runs these against an installed runtime
# and writes the manifest the launcher reads.

schema = 1

[[capability]]
name = "graphics.native-wayland"
summary = "Native Wayland display and fractional scaling for HDR through the host Vulkan driver"
provided-by = [
    "https://github.com/icex/wine/commit/accc08b648ebef4191ef91a5070ee2ece733ebde",
    "https://github.com/icex/Proton-UWP/commit/cb6e279c2fb373e7ea85de2d91ca19ffd60c04fe",
]
symptom-if-missing = "Native Wayland HDR is unavailable, or a scaled desktop crops the game's rendering surface."
verify = [
    { file = "files/lib/wine/x86_64-unix/winewayland.so", contains = "wp_fractional_scale_manager_v1" },
    { file = "files/lib/wine/x86_64-windows/winewayland.drv", contains = "waylanddrv" },
    { file = "files/lib/wine/i386-windows/winewayland.drv", contains = "waylanddrv" },
    { file = "files/share/default_pfx/drive_c/windows/system32/winewayland.drv", contains = "waylanddrv" },
    { file = "files/share/default_pfx/drive_c/windows/syswow64/winewayland.drv", contains = "waylanddrv" },
]

