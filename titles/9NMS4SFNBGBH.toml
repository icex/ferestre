schema = 1

[title]
product-id = "9NMS4SFNBGBH"
name = "Dead by Daylight Windows"
slug = "dead-by-daylight-windows"

[launch]
executable = "DeadByDaylight.exe"

[runtime]
requires = [
    "loader.memfd-main-image",
    "xgameruntime.user",
]
wants = [
    "appmodel.package-identity",
    "xgameruntime.store-collections-id",
]

[status]
state = "broken"
summary = "Signs in and, with the Collections ID key, gets its store content; then crashes on the splash screen."
stops-at = "Loading Characters on the splash screen: the game crashes right after its real-time messaging websocket connects"
blocked-by = "runtime-gap"
last-verified = 2026-11-22
verified-with = "Xbox PC package of game version 10.2.2 with Easy Anti-Cheat, run headless (no input) on a local runtime with xgameruntime 9de84aa and the matching xodus-service."

[[issues]]
symptom = "CANNOT CONNECT TO STORE: Cannot retrieve the list of available content, on the splash screen about a minute after launch"
cause = "XStoreGetUserCollectionsIdAsync returned an empty key, and the game's backend refuses an empty key (owned-products/get-update-entitlements answers 400)."
fix = "Use a runtime advertising xgameruntime.store-collections-id with its matching xodus-service."

[[issues]]
symptom = "Crash reporter (EXCEPTION_ACCESS_VIOLATION) while the splash screen says Loading Characters"
cause = "The game queues a second WinHTTP websocket receive on rtm-v3.live.bhvrdbd.com while the first is still pending; Wine refuses it with ERROR_INVALID_OPERATION and the game then reads freed memory. Not yet fixed."
fix = "None yet: needs a WinHTTP websocket change in the runtime."
log-match = "Attempt to queue receive while another is pending"
