[package]
name = "ferestre-cli"
description = "Download and run the Microsoft Store and Xbox GDK titles you own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferestre"
path = "src/main.rs"

[dependencies]
ferestre-core = { path = "../ferestre-core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
libc.workspace = true

[dev-dependencies]
# Signs fixture runtime archives with a throwaway key.
ferestre-core = { path = "../ferestre-core", features = ["test-signing"] }
