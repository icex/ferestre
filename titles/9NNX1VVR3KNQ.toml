# Forza Horizon 5 (Microsoft Store)
#
# Runs. It reaches the welcome screen.
#
# Getting here took five fixes and two wrong conclusions, both of which said
# some version of "the title is defending itself and there is nothing to be
# done". Neither was true. Every one of these was ours:
#
#   1. The image is mapped from a memfd, so NtQueryVirtualMemory with
#      MemoryMappedFilenameInformation returned an empty string -- the title
#      was told its own code came from nowhere, and the handler that restores
#      its elided call sites declined the first one. patches/wine/0010.
#   2. concrt140's _Internal_capacity counted a segment another thread was
#      still allocating, so _Internal_reserve returned early and callers
#      derived element pointers from the in-progress marker. patches/wine/0011.
#   3. XGameGetXboxTitleId answered zero when MicrosoftGame.config carries the
#      title id. patches/xgameruntime/0007.
#   4. XPackageEnumeratePackages reported the package family name as the
#      display name and blanks for description, publisher and store id.
#      patches/xgameruntime/0008.
#   5. And the one that was actually stopping it: patches/wine/0009 matched the
#      image map by exact NT name, so \??\GlobalRoot\??\Z:\...\ForzaHorizon5.exe
#      matched nothing. The title opens its own executable through that spelling
#      -- three read-only opens -- hashes what it reads, and the bytes it got
#      were the still-encrypted ones from disk. It then called TerminateProcess
#      on itself with 0x1100. patches/wine/0013 strips the prefix before
#      comparing, the way the file layer does a moment later.
#
# The elided call sites are real and still there: about a third of its functions
# have their direct calls replaced by five bytes of filler whose first byte has
# no encoding in 64-bit mode, restored lazily from a vectored handler.
# tools/pe-holes.py measures it. That mechanism works here -- 327,000 faults in
# a startup, every one resumed -- and never needed defeating. It needed to be
# told the truth about where its code lives.
#
# WHAT IT DOES NOW
#
#   * window: "Forza Horizon 5", confirmed through KWin's window list
#   * splash, then the welcome screen
#   * 342,000+ GDK calls and climbing, XTaskQueueDispatch pumping continuously
#   * XUserGetGamertag, XUserGetId, XUserGetLocalId -- it has a signed-in user
#   * loads its FMOD audio banks, including glb_radiopressstart and glb_ui
#
# Not yet taken past the welcome screen, so this is `menus` and not `playable`.
# Loading into a race, saves and multiplayer are all unverified.

schema = 1

[title]
product-id       = "9NNX1VVR3KNQ"
name             = "Forza Horizon 5"
slug             = "fh5"
publisher        = "Microsoft Studios"
package-identity = "Microsoft.624F8B84B80"
title-id         = "7900C3C7"
install-size-gb  = 149.0

[install]
dir-env    = "FH5_DIR"
prefix-env = "FH5_PREFIX"

[launch]
executable = 'ForzaHorizon5.exe'

[runtime]
requires = [
    "loader.memfd-main-image",
    "loader.mapped-image-through-file-api",
    "loader.section-name-for-mapped-image",
    "concrt140.concurrent-vector-push-back",
    "xgameruntime.title-id",
    "xgameruntime.package-details",
    "xgameruntime.speech-voice-enumeration",
]

[status]
state         = "menus"
summary       = "Reaches the welcome screen. Not taken further, so loading into a race, saves and multiplayer are unverified."
stops-at      = "not verified past the welcome screen"
last-verified = 2026-09-07
verified-with = "ferestre run fh5; the window confirmed through KWin's window list, and the GDK trace showing XTaskQueueDispatch pumping and XUserGetGamertag answering"

[[issues]]
symptom   = "the game exits seconds after launch with no window; the log ends in an unhandled illegal instruction inside ForzaHorizon5.exe"
cause     = "the title asks which file its own image was mapped from and is told nothing, because the image is mapped from a memfd that has no name in the NT namespace; its own handler then declines to restore the first elided call site"
fix       = "fixed by patches/wine/0010"
log-match = "Unhandled illegal instruction at address .* \\(thread"

[[issues]]
symptom   = "the game exits during startup and leaves Upload_CrashReport.xml naming ACCESS_VIOLATION_WRITE at 0x0000000000000009"
cause     = "concrt140's _Internal_push_back returned SEGMENT_ALLOC_MARKER (1) instead of a pointer, because _Internal_capacity counts a segment another thread is still allocating as capacity"
fix       = "fixed by patches/wine/0011"
log-match = "ACCESS_VIOLATION_WRITE"

[[issues]]
symptom   = "the splash screen appears, the window closes again, and the process exits 1 with no crash report and no fatal signal"
cause   = "the title opens its own executable as \\??\\GlobalRoot\\??\\Z:\\... to verify it, that spelling did not match the image map, and it hashed the encrypted bytes on disk. It then called TerminateProcess on itself with 0x1100"
fix       = "fixed by patches/wine/0013: strip the GlobalRoot prefix before matching, as the file layer does"
log-match = "process terminating itself abnormally"
