[package]
name = "xgdk-gui"
description = "A window over the xgdk launcher: your titles, their state, and one button to play them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xgdk-gui"
path = "src/main.rs"

[dependencies]
# The GUI links xgdk-core for the decisions -- same workspace, same MIT licence,
# and it means the window and the CLI cannot disagree about what a recipe says.
# It never links Xodus: that stays a child process, for the licence and because
# the decrypted executable has to remain a child of whoever opened it.
xgdk-core = { path = "../xgdk-core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
