[workspace]
resolver = "2"
members = ["crates/ferestre-core", "crates/ferestre-cli", "crates/ferestre-gui"]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/icex/ferestre"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Only for the anonymous catalog and profile calls. Blocking on purpose: the
# two callers already run these off the main thread, and an async runtime would
# be a much larger dependency for two GETs.
ureq = "3"
# One call: signalling a process group, so stopping a title reaches the game
# and not just the launcher process that started it.
libc = "0.2"
