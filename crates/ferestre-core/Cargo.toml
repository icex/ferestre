[package]
name = "ferestre-core"
description = "Recipes, paths and launch environment for running Xbox GDK titles on Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
sha2 = "0.10"
# Verifies the minisign signature of a downloaded release artefact. No
# dependencies of its own.
minisign-verify = "0.3"
ureq.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
# Signs test artefacts with a key pair generated in the test, to check the
# release signature verification against.
ed25519-dalek = "2"
# Tests sign with a throwaway key pair they generate, in the real format.
minisign = "0.7"
