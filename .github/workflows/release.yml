# The launcher's release train: the small, frequent one.
#
# Three artefacts, all x86_64 Linux:
#
#   ferestre-<version>-x86_64.tar.zst   the tree an installed copy has, so the
#                                       binary finds its scripts, patches and
#                                       recipes exactly the way the AUR package
#                                       lays them out -- usr/bin beside
#                                       usr/lib/ferestre. Extract anywhere.
#   Ferestre-<version>-x86_64.AppImage  one file, for people who do not want to
#                                       extract anything.
#   SHA256SUMS                          for both, so a download can be checked.
#
# The runtime still has its own build train and tags, but the launcher release
# embeds its latest verified artifact. A fresh installation must be able to
# sign in and run a title without separately locating a client or Proton build.
#
# Cutting a release:
#
#   git tag -a v0.1.0 -m 'what changed' && git push origin v0.1.0
#
# A workflow_dispatch run builds and uploads the same artefacts without
# publishing anything, which is how to find out whether a release would build
# before committing to a tag.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp the artefacts with (default: the workspace version)'
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  launcher:
    runs-on: ubuntu-latest
    # A release that publishes has to be able to write one.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The AppImage stamps the build it came from, and a shallow clone
          # cannot describe itself.
          fetch-depth: 0

      # A tag can be created on any branch, and a release cut from dev would
      # publish work that never reached main. Now that there are two branches
      # this is worth one fetch to be sure of.
      - name: The tag must be on main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git -C "." fetch --quiet --depth=100 origin main
          if ! git -C "." merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main -- merge to main and tag there"
              exit 1
          fi
          echo ":: $GITHUB_REF_NAME is on main"

      # GTK4 and libadwaita because the GUI links them; fuse3 because the
      # AppImage self-test at the end of the packaging script mounts the image
      # it just built, and a build that cannot run its own output has not been
      # tested at all.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            fuse3 libfuse3-3 zstd protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A tag is the version, without its leading v. Otherwise the workspace
      # says what it is, and a manual run may override that.
      - name: Version
        id: version
        # Through the environment rather than interpolated into the script:
        # a workflow_dispatch input is text somebody typed, and text somebody
        # typed has no business being pasted into a shell.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
              version=$INPUT_VERSION
          elif [ "${GITHUB_REF_TYPE}" = tag ]; then
              version=${GITHUB_REF_NAME#v}
          else
              version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
              version="$version+$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo ":: building $version"

      # A release is not the place to discover a broken test. The same suite
      # rust.yml runs per push, run again against the exact tree being shipped.
      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --workspace

      # A release that opens but cannot sign in is not a usable AppImage. Build
      # the GPL client separately and ship it beside the MIT launcher; the two
      # still communicate solely by process invocation. The same ordered patch
      # series the AUR package applies is used here, so the binary in the image
      # and its corresponding source diffs describe the same client.
      - name: Build bundled Xodus client
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/xodus-gaming/xodus.git xodus
          git -C xodus checkout --quiet 3e75c9f2d3aad2ea2fdc488d92d0163eb68c1a60
          for patch in patches/xodus-cli/*.patch; do
              case "$(basename "$patch")" in 0001-*) continue ;; esac
              git -C xodus apply "$GITHUB_WORKSPACE/$patch"
          done
          cargo build --release --manifest-path xodus/Cargo.toml \
              -p xodus-cli -p xodus-service

      # The runtime is independently versioned and large, but it is required
      # before a title can launch. Carry the latest published runtime in the
      # AppImage so first start has every required component without asking a
      # new user to find a second release or build Proton from source.
      - name: Fetch bundled runtime
        id: bundled-runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo icex/ferestre --limit 100 | awk '$1 ~ /^runtime-/ { print $1; exit }')
          test -n "$tag"
          mkdir runtime-download
          gh release download "$tag" --repo icex/ferestre \
              --pattern 'ferestre-runtime-*.tar.xz' --dir runtime-download
          archive=$(find runtime-download -maxdepth 1 -name 'ferestre-runtime-*.tar.xz' -print -quit)
          test -n "$archive"
          tar -xJf "$archive" -C runtime-download
          runtime=$(find runtime-download -mindepth 1 -maxdepth 1 -type d -name 'ferestre-runtime-*' -print -quit)
          test -n "$runtime"
          echo "dir=$runtime" >> "$GITHUB_OUTPUT"

      # The layout an installed copy has: usr/bin/ferestre with
      # usr/lib/ferestre beside it. paths.rs looks for its repository root at
      # <binary>/../lib/ferestre before it looks at /usr/lib/ferestre, so this
      # tree works extracted anywhere without being installed -- and it works
      # through the same code path a packaged install uses, rather than a
      # second one that only the tarball exercises.
      - name: Stage the tree
        id: stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          root="stage/ferestre-$VERSION"
          install -d "$root/usr/bin" "$root/usr/lib/ferestre"
          install -Dm755 target/release/ferestre     "$root/usr/bin/ferestre"
          install -Dm755 target/release/ferestre-gui "$root/usr/bin/ferestre-gui"
          install -Dm755 xodus/target/release/xodus-cli \
              "$root/usr/lib/ferestre/client/xodus-cli"
          install -Dm755 xodus/target/release/xodus-service \
              "$root/usr/lib/ferestre/client/xodus-service"
          cp -a "${{ steps.bundled-runtime.outputs.dir }}" \
              "$root/usr/lib/ferestre/runtime"

          # Not documentation: launch-gdk.sh is the launch path and
          # proton-wine-shim.sh is what the client execs as its "wine".
          # patches/ travels with them because install-xodus-proton.sh reads
          # patches/proton out of the repository root.
          cp -a scripts patches titles "$root/usr/lib/ferestre/"
          find "$root/usr/lib/ferestre/scripts" -name '*.sh' -exec chmod 0755 {} +
          printf '%s\n' "$VERSION" > "$root/usr/lib/ferestre/VERSION"

          id=io.github.icex.ferestre
          install -Dm644 "packaging/appimage/$id.desktop" \
              "$root/usr/share/applications/$id.desktop"
          install -Dm644 "packaging/appimage/$id.metainfo.xml" \
              "$root/usr/share/metainfo/$id.metainfo.xml"
          install -Dm644 "packaging/appimage/$id.png" \
              "$root/usr/share/icons/hicolor/256x256/apps/$id.png"
          if [ -f "packaging/icons/hicolor/scalable/apps/$id.svg" ]; then
              install -Dm644 "packaging/icons/hicolor/scalable/apps/$id.svg" \
                  "$root/usr/share/icons/hicolor/scalable/apps/$id.svg"
          fi

          for doc in README.md NOTICE docs/RECIPES.md docs/ROADMAP.md docs/COMPATIBILITY.md; do
              install -Dm644 "$doc" "$root/usr/share/doc/ferestre/$(basename "$doc")"
          done
          for lic in LICENSE LICENSE.LGPL-2.1; do
              # An `if`, not `[ -f ] && install`: under `set -e` a false test as
              # the last command of a loop body ends the step, and a missing
              # optional licence file would fail the release rather than be
              # skipped.
              if [ -f "$lic" ]; then
                  install -Dm644 "$lic" "$root/usr/share/licenses/ferestre/$lic"
              fi
          done

          mkdir -p out
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              -C stage -caf "out/ferestre-$VERSION-x86_64.tar.zst" "ferestre-$VERSION"
          echo "tarball=out/ferestre-$VERSION-x86_64.tar.zst" >> "$GITHUB_OUTPUT"

      # The script downloads its own pinned appimagetool and type-2 runtime,
      # checks both against recorded hashes, and runs the result once before
      # calling it built. See packaging/appimage/build-appimage.sh for why it
      # never lets appimagetool mount itself.
      - name: AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          packaging/appimage/build-appimage.sh \
            --bin target/release/ferestre-gui \
            --client xodus/target/release/xodus-cli \
            --runtime "${{ steps.bundled-runtime.outputs.dir }}" \
            --version "$VERSION" \
            --out out

      - name: Checksums
        working-directory: out
        run: |
          sha256sum ./*.AppImage ./*.tar.zst > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ferestre-${{ steps.version.outputs.version }}
          path: out/*
          if-no-files-found: error

      # Only a tag publishes. A manual run has produced the same artefacts and
      # attached them to the run, which is the point of being able to try.
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "ferestre $VERSION" \
            --generate-notes \
            --notes "
          ### What is in here

          | File | What it is |
          |---|---|
          | \`Ferestre-$VERSION-x86_64.AppImage\` | One file. Make it executable and run it. |
          | \`ferestre-$VERSION-x86_64.tar.zst\` | The same tree an installed copy has. Extract anywhere and run \`usr/bin/ferestre\`. |
          | \`SHA256SUMS\` | Checksums for both. |

          The AppImage and tarball include the Xodus client and a patched Proton
          runtime, so a fresh installation can sign in and launch titles at
          first start. The runtime is still released independently under
          \`runtime-*\` tags for maintainers and AUR users.

          You need to own the games. This downloads and runs what your own
          Microsoft account is licensed for, and nothing else.
          "
