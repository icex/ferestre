# Halo Infinite -- Microsoft Store / Game Pass Ultimate.
# Keep the package's EasyAntiCheat bootstrapper and original executable bytes.
# Licensed images are visible at their installed paths only in a private tmpfs
# mount namespace; the encrypted installation on disk is never rewritten.
schema = 1

[title]
product-id = "9PP5G1F0C2B6"
name = "Halo Infinite"
slug = "halo-infinite"
publisher = "Microsoft Studios"
package-identity = "Microsoft.254428597CFE2"
title-id = "79C6D2A0"

[install]
dir-env = "HALO_INFINITE_DIR"
prefix-env = "HALO_INFINITE_PREFIX"

[launch]
executable = 'HaloInfinite.exe'
env = { FERESTRE_IMAGE_VIEW = "real-path", XGR_STRICT_MANUAL_QUEUES = "1" }

[runtime]
requires = [
    "loader.memfd-main-image",
    "appmodel.package-identity",
    "xgameruntime.user",
    "xgameruntime.networking",
    "xgameruntime.gamesave",
    "xgameruntime.user-handle-result-size",
    "xgameruntime.save-result-sizes",
    "xgameruntime.manual-queue-thread-affinity",
]

[[saves]]
kind = "wgs"
windows = '%LOCALAPPDATA%\Packages\Microsoft.254428597CFE2_8wekyb3d8bbwe\SystemAppData\wgs'
prefix = 'drive_c/users/steamuser/AppData/Local/Packages/Microsoft.254428597CFE2_8wekyb3d8bbwe/SystemAppData/wgs'
note = "Local campaign checkpoints and settings. Cloud synchronization has not been qualified."

[status]
state = "playable"
summary = "Campaign, Academy training and multiplayer run; campaign save restoration was confirmed locally. Intermittent offline display remains under investigation."
last-verified = 2026-10-10
verified-with = "Game Pass Ultimate, package 1.4206.46191.0; live Warship Gbraakon gameplay, user-confirmed saving, campaign handoff/relaunch and clean process exit; 216 general and 46 manual-queue checks"

[[issues]]
symptom = "EasyAntiCheat reports Failed to locate the game binary (Wine)"
cause = "Its Linux module looks for the installed executable path in /proc mappings; a memfd mapping has no matching file path."
fix = "The real-path image view requires Python 3, util-linux and unprivileged user/mount namespaces. Update the launcher and runtime together."
log-match = "Failed to locate the game binary"

[[issues]]
symptom = "Campaign aborts while loading with Thread not registered"
cause = "Async work submitted to a Manual queue ran on an unrelated thread-pool thread."
fix = "Use a runtime providing manual-queue-thread-affinity and this recipe's XGR_STRICT_MANUAL_QUEUES=1 setting."
log-match = "Thread not registered"

[[issues]]
symptom = "The game sometimes displays the account as offline"
cause = "Not established. Captured sign-in, presence, profile and session requests succeeded; the observed HTTP 400s were image requests."
fix = "Under investigation; no proven workaround."

[[issues]]
symptom = "A startup dialog says the Microsoft Store and Xbox Live users differ"
cause = "Microsoft Store account and purchase integration is incomplete in the replacement runtime."
fix = "Dismiss the dialog to play. Real-money purchases are not qualified."
