  workflow_dispatch:

permissions:
  contents: read

# One run per pull request: a newer push, or the second event a stacked
# force-push fires for the same commit, cancels the run before it. Pushes to
# main and dev, tags and manual runs each get a group of their own (the run
# id), so they never cancel or queue behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental data is large and CI rebuilds whole crates anyway; the hosted
  # cache would drop it, and the persistent self-hosted directory would only
  # fill up with it.
  CARGO_INCREMENTAL: '0'
  # Line tables are what a test failure's backtrace needs; full debug info
  # only makes the target directory bigger and every link slower.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # On a hosted runner, so it never waits for a build slot: formatting, which
  # fails fast and costs nothing, and the paths that decide which of the
  # heavier jobs a pull request needs.
  preflight:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      gui: ${{ steps.changes.outputs.gui }}
      sources: ${{ steps.changes.outputs.sources }}
    steps:
      # Two commits: a pull request's checkout is GitHub's merge commit, and
      # its first parent is the base branch it would merge into.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Which jobs this change needs
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: .github/scripts/ci-changes.sh "$EVENT"

  test:
    needs: preflight
    runs-on: ${{ fromJSON(vars.FERESTRE_RUNNER_LABELS || '["self-hosted", "linux", "x64", "icex-ci"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The GUI crate links GTK4 and libadwaita, so the workspace needs them
      # even to type-check.
      # minisign for the release signing tests, shellcheck for the shell
      # syntax step, PyYAML for the workflow checks.
      - name: System libraries
        if: runner.environment != 'self-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev minisign shellcheck python3-yaml

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy

      # Self-hosted: a build directory that outlives the job, so only what
      # changed is rebuilt (see the script). Hosted: the GitHub cache,
      # restored everywhere and saved only from main, because a cache saved
      # for a pull request or another branch is visible to that ref alone,
      # and every copy counts against the repository's 10 GB.
      - name: Persistent build directory
        if: runner.environment == 'self-hosted'
        run: .github/scripts/ci-target-dir.sh target ferestre 12

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment != 'self-hosted'
        with:
          key: ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Formatting is checked in `preflight`.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Ubuntu's runners restrict unprivileged user namespaces through
      # AppArmor, and the image-view tests skip themselves where the namespace
      # probe fails -- which would leave the code that keeps decrypted game
      # files private, and the graceful Stop of a title inside the image
      # view's namespaces (stop.rs), untested behind a green tick. Lift the
      # restriction for this runner before any test runs, and tell the tests
      # a skip is a failure here.
      - name: Allow unprivileged user namespaces
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          # Self-hosted isolation is configured by the runner administrator;
          # its no-new-privileges boundary deliberately rejects sudo.
          if [ "$RUNNER_KIND" != self-hosted ] && [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount true

      - name: Test
        env:
          FERESTRE_REQUIRE_USERNS: '1'
        run: cargo test --locked --workspace

      - name: Download cancellation (offline)
        run: cargo build --locked -p ferestre-cli && python3 tests/test_download_cancel.py && python3 tests/test_transfer_controls.py && python3 tests/test_media_dependencies.py && python3 tests/test_client_dependencies.py

      - name: Launch helper tests
        env:
          FERESTRE_REQUIRE_USERNS: '1'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*image_view.py'
          python3 tests/test_proton_wine_shim.py
          python3 tests/test_game_session.py
          python3 tests/test_fix_xcurl.py
          python3 tests/test_launch_gdk.py
          python3 tests/test_run_already_running.py
          python3 tests/test_install_xodus_proton.py

      # Syntax for every shell script, under the shell its #! names: the shim
      # and xodus-env.sh run under /bin/sh, which is dash here, so a bashism
      # in them is caught by sh -n and would otherwise only show at launch.
      # shellcheck at error severity on top, which finds what -n cannot (an
      # unquoted array, a test that is always true) without failing on style.
      - name: Shell syntax
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
              case "$(head -n1 "$f")" in
                  *bash*) shell='bash' ;;
                  '#!/bin/sh'*|'#!/usr/bin/env sh'*) shell='sh' ;;
                  *) case "$f" in *.sh) shell='sh' ;; *) continue ;; esac ;;
              esac
              "$shell" -n "$f" || status=1
              shellcheck --severity=error --shell="$shell" "$f" || status=1
          done < <(find scripts packaging tests .github/scripts -type f \( -name '*.sh' -o -name AppRun \) -print0)
          exit "$status"

      - name: Packaging and release tests
        env:
          FERESTRE_REQUIRE_MINISIGN: '1'
        run: |
          python3 tests/test_workflows.py
          python3 tests/test_ci_changes.py
          python3 tests/test_source_pins.py
          python3 tests/test_no_nvidia_urls.py
          python3 tests/test_build_dlssnr.py
          python3 tests/test_runtime_staging.py
          python3 tests/test_release_signing.py
          python3 tests/test_build_appimage.py

      - name: Developer tool tests (offline)
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  # The oldest compiler the workspace says it builds with. 1.88 is not a
  # preference: it is what the dependency versions in Cargo.lock require
  # (zopfli, under zip's deflate feature, is the newest at 1.88). Raise this
  # together with `rust-version` in Cargo.toml, in the commit that moves the
  # lock; tests/test_workflows.py checks the two agree.
  #
  # On a pull request it type-checks every target, tests included, which is
  # what catches a newer std or language feature; a push to main or dev
  # builds and runs the whole test suite with it. Pull requests that touch
  # no Rust skip it. Hosted, so it never waits for a build slot.
  msrv:
    needs: preflight
    if: needs.preflight.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: '1.88'

      # Restored everywhere, saved only from main: a cache saved for a pull
      # request or another branch is visible to that ref alone, and every
      # copy counts against the repository's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # As in `test`: the namespace tests must run, not skip.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount true

      # Named explicitly, so a runner image with a different default compiler
      # cannot make this job test something else.
      - name: Type-check with the minimum supported Rust
        if: github.event_name == 'pull_request'
        run: |
          rustc +1.88 --version
          cargo +1.88 check --locked --workspace --all-targets

      - name: Test with the minimum supported Rust
        if: github.event_name != 'pull_request'
        env:
          FERESTRE_REQUIRE_USERNS: '1'
        run: |
          rustc +1.88 --version
          cargo +1.88 test --locked --workspace

  # Verify all five immutable fork commits and their nested gitlinks without
  # checking out the complete Wine tree, then run the client's offline tests.
  # A pull request that touches none of the pins, the forks or the scripts
  # and fixtures they use skips it (.github/scripts/ci-changes.sh). Hosted.
  sources:
    needs: preflight
    if: needs.preflight.outputs.sources == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out the pinned client fork
        run: git submodule update --init --quiet third_party/xodus-cli

      - name: Verify public fork commits and nested pins
        run: scripts/check-sources.sh --remote

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      # WebKitGTK, GTK 3 and libsoup because xodus-cli links wry for the
      # sign-in window, and its tests link the binary's crate.
      - name: Client test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev protobuf-compiler \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev

      # The client is a workspace of its own, with its own target directory.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-24.04
          workspaces: third_party/xodus-cli -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fixture script syntax
        run: |
          bash -n tests/run-tests.sh tests/build-license-service-fixture.sh
          python3 -m py_compile tests/license_token_fixture.py tests/related_license_fixture.py

      # Offline, loopback only: the service, the download integrity checks
      # (msixvc's hash tree, header signatures with throwaway test keys, and
      # retries; the CLI's path and commit rules, and the package key's
      # sourcing against recorded-shape fixtures -- its live tests are
      # ignored),
      # the presence runner (a local server and a fake token provider; it
      # never signs in), the profile store and the file-backed key chain.
      #
      # Three cargo calls rather than one per filter: every call re-checks the
      # graph and relinks each test binary, and the xodus filters go to one
      # call together (libtest runs a test that matches any of them).
      - name: Test the pinned client fork offline
        run: |
          set -euo pipefail
          python3 scripts/source-pins.py verify xodus --directory third_party/xodus-cli
          cd third_party/xodus-cli
          cargo test --locked -p xodus-service -p msixvc -p xodus-cli
          cargo test --locked -p xodus -- profile api::xbox::auth device_response_ licensing::store_ticket
          cargo test --locked -p xodus --features key-chain-file --test key_chain_file

      - name: Runtime refresh correction unit tests
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          repository=$(python3 scripts/source-pins.py get wine repository)
          commit=$(python3 scripts/source-pins.py get wine commit)
          git clone --quiet --filter=blob:none --no-checkout --depth=1 "$repository" "$scratch/wine"
          git -C "$scratch/wine" fetch --quiet --depth=1 origin "$commit"
          for file in dlls/winex11.drv/desktop_refresh.h tools/ferestre/test_desktop_refresh.py; do
              mkdir -p "$scratch/check/$(dirname "$file")"
              git -C "$scratch/wine" show "$commit:$file" > "$scratch/check/$file"
          done
          python3 "$scratch/check/tools/ferestre/test_desktop_refresh.py"

  # The window, built once for the four GUI shards. A pull request that
  # touches neither the crates nor the window's tests, fixtures or recipes
  # skips it (.github/scripts/ci-changes.sh). Hosted.
  gui-build:
    needs: preflight
    if: needs.preflight.outputs.gui == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the window
        run: cargo build --locked -p ferestre-gui -p ferestre-cli

      - name: Accessibility action-export unit tests
        run: python3 tests/test_gui_actions.py

      # Only the two binaries the tests start. The ferestre CLI must sit
      # beside ferestre-gui: the tests find it there.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gui-binaries
          path: |
            target/debug/ferestre-gui
            target/debug/ferestre
          if-no-files-found: error
          retention-days: 1

  # The window driven through AT-SPI, in four shards that run at once. Each
  # test gets its own Xvfb and session bus (tests/run_gui_ci.py); the split
  # is by the measured weights in tests/gui_ci.json, and gui_smoke.py alone
  # (about 150 s) is the floor. Every test in a shard runs even after one
  # fails, and the step summary lists each test's time.
  gui:
    needs: gui-build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Run-time libraries only; nothing is compiled here.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 libadwaita-1-0 \
            at-spi2-core gir1.2-atspi-2.0 python3-gi openbox \
            xvfb dbus-x11

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gui-binaries
          path: target/debug

      # Artifacts do not keep the executable bit.
      - name: GUI tests, shard ${{ matrix.shard }} of 4
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          chmod +x target/debug/ferestre-gui target/debug/ferestre
          python3 tests/run_gui_ci.py --shard "$SHARD/4"
