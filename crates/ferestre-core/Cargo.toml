[package]
name = "ferestre-core"
description = "Recipes, paths and launch environment for running Xbox GDK titles on Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
sha2 = "0.10"
ureq.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
# Verifies the minisign signatures release CI puts beside downloaded artefacts.
# No dependencies of its own.
minisign-verify = "0.3"
# Only for `signing::testing`, which signs with a throwaway key in tests.
ed25519-compact = { version = "2", default-features = false, optional = true }

[features]
# Exposes `signing::testing` to other crates' tests.
test-signing = ["dep:ed25519-compact"]

[dev-dependencies]
tempfile = "3"
ed25519-compact = { version = "2", default-features = false }
